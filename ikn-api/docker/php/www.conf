; php-fpm pool ikn-api. pm.max_children dihitung dari RAM: (RAM untuk PHP / ~40 MB per worker), default 12 untuk 4 GB.
[www]
user = www
group = www
listen = 9000
pm = dynamic
pm.max_children = ${PHP_PM_MAX_CHILDREN}
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status
request_terminate_timeout = 120s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 102M
php_admin_value[post_max_size] = 105M
php_admin_value[expose_php] = Off
