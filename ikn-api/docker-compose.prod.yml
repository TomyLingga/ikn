# Produksi (VPS Hostinger, Ubuntu 24.04, Docker Engine + compose plugin). Jalankan dari folder deploy yang berisi
# file ini, Caddyfile, .env.docker (API) dan .env.fe (FE). Hanya caddy yang publish port (80/443).
# docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
name: ikn

x-api-image: &api-image ghcr.io/tomylingga/ikn-api:${IKN_API_TAG:-latest}
x-api-env: &api-env
  env_file: .env.docker
  environment:
    APP_ENV: production
    PHP_PM_MAX_CHILDREN: ${PHP_PM_MAX_CHILDREN:-12}
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
x-api-volumes: &api-volumes
  volumes:
    - storage:/var/www/html/storage/app
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    image: caddy:2-alpine
    <<: *restart
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [fe, nginx]
    deploy: { resources: { limits: { memory: 256m } } }

  fe:
    image: ghcr.io/tomylingga/ikn-fe:${IKN_FE_TAG:-latest}
    <<: *restart
    env_file: .env.fe
    environment:
      API_INTERNAL_URL: http://nginx/api/v1
      PORT: "3000"
    depends_on: [nginx]
    deploy: { resources: { limits: { memory: 768m } } }

  nginx:
    image: nginx:1.27-alpine
    <<: *restart
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage/app:ro
    depends_on: [app]
    deploy: { resources: { limits: { memory: 128m } } }

  app:
    image: *api-image
    <<: [*restart, *api-env, *api-volumes]
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      PHP_PM_MAX_CHILDREN: ${PHP_PM_MAX_CHILDREN:-12}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
    volumes:
      - storage:/var/www/html/storage/app
      - public:/var/www/html/public
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 1g } } }

  queue:
    image: *api-image
    <<: [*restart, *api-env, *api-volumes]
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--sleep=3", "--max-time=3600"]
    depends_on:
      db: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  scheduler:
    image: *api-image
    <<: [*restart, *api-env, *api-volumes]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  db:
    image: postgres:16-alpine
    <<: *restart
    env_file: .env.docker
    environment:
      TZ: Asia/Jakarta
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
               -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
               -c max_connections=${PG_MAX_CONNECTIONS:-60}
               -c work_mem=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy: { resources: { limits: { memory: 1g } } }

volumes:
  pgdata:
  storage:
  public:
  caddy_data:
  caddy_config:
