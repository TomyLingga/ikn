# Fragmen OpenAPI area katalog & konfigurasi commerce (BE-2). Digabung oleh docs/openapi/merge.py.
tags:
  - name: catalog
    description: Katalog publik (kategori, produk, ulasan) dan konfigurasi commerce publik
  - name: cart
    description: Quote keranjang (validasi item + hitung total tanpa membuat order)
  - name: admin-catalog
    description: Admin kategori, produk, gambar, ulasan, stok
  - name: admin-commerce-config
    description: Admin rekening bank, fee, zona/tarif ongkir, cara serah terima + titik ambil Loco, voucher, metode bayar, settings commerce

paths:
  # ---------------------------------------------------------------- katalog publik (kontrak 6)
  /catalog/categories:
    get:
      tags: [catalog]
      summary: Kategori aktif + jumlah produk published
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
  /catalog/products:
    get:
      tags: [catalog]
      summary: Produk published (paginated)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'ILIKE pada name id/en, code, slug, aliases' }
        - { name: category, in: query, schema: { type: string }, description: slug (atau id) kategori }
        - { name: sort, in: query, schema: { type: string, enum: [name, price, newest] }, description: 'default: urutan id; price = rupiah, atau price_usd untuk customer ekspor yang login (ASUMSI A-86)' }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /catalog/products/{slug}:
    get:
      tags: [catalog]
      summary: Detail produk published + reviews (10 terbaru tayang) + related (4 produk kategori sama)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ProductDetail' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/products/{slug}/reviews:
    get:
      tags: [catalog]
      summary: Ulasan tayang (paginated, terbaru dulu)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: perPage, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Review' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- konfigurasi commerce publik (kontrak 9, 10)
  /commerce/config:
    get:
      tags: [catalog]
      summary: Metode bayar aktif (tanpa config), rekening aktif (+ mata uang), fee aktif se-mata-uang, settings commerce yang publik, cara serah terima + syarat bayar aktif pasar pengunjung, titik ambil Loco
      description: |
        Bagian yang bergantung pasar (ASUMSI A-86) mengikuti pengunjung: customer ekspor yang login mendapat `market = export`,
        `currency = USD`, `deliveryTerms` ekspor (FOB, CIF), `paymentTerms` ekspor, dan `fees` USD. Tamu, admin, dan customer lokal
        mendapat pasar lokal (IDR). `bankAccounts` selalu semua rekening aktif beserta `currency`; FE menyaring sesuai mata uang order.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceConfig' } } } } } }
  /payment-methods:
    get:
      tags: [catalog]
      summary: Metode bayar aktif + instruksi + qrisImageUrl (qris_static)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PaymentMethodPublic' } } } } } } }

  # ---------------------------------------------------------------- cart (kontrak 9)
  /cart/quote:
    post:
      tags: [cart]
      security: [{ cookieAuth: [] }]
      summary: Validasi item dan hitung total tanpa membuat order (customer login; belum harus disetujui)
      description: |
        Body sama dengan POST /customer/orders. `deliveryTermCode` memilih cara serah terima (ASUMSI A-85); kosong =
        term aktif pertama pasar lokal (sortOrder). Term `pricingMode = zone` (Franco): tanpa `addressId` → `shipping = null`,
        `availableShippingRates = []`; dengan `addressId` (alamat milik user) `availableShippingRates[]` dihitung untuk berat
        keranjang dan `shipping` terisi bila `shippingRateId` termasuk daftar itu. Dua pabrik atau lebih (ASUMSI A-90): item
        dikelompokkan per pabrik asal (`items[].factory`); tiap tarif dihitung per pabrik (base, minAmount, berat, volume, jarak
        dari pabrik itu) lalu dijumlah, rinciannya di `origins[]`; `freeAbove` dibandingkan dengan subtotal − diskon seluruh order.
        Term Loco: `pickupPoints[]` = satu titik ambil per pabrik asal; bila ada item dari pabrik `allowsPickup = false` → 422
        `deliveryTermCode`. Term tanpa ongkir (Loco `none`, FOB `included`):
        `shipping` = baris sintetis `{ type: pickup|included, amount: 0, rateId: null }`, `availableShippingRates = []`, alamat
        dan `shippingRateId` diabaikan tanpa warning. Term CIF (`quoted`, ASUMSI A-89): `shipping.type = quoted`, `amount` 0, dan
        `warnings` berisi `freight_quote_pending` (ongkir ditawarkan admin setelah order dibuat). `uniqueCode` bersifat sementara (1–999) bila metode `manual_transfer`
        dan setting `uniqueCodeEnabled`; nilai final ditetapkan saat checkout.
        Mata uang (ASUMSI A-86) mengikuti pasar customer: customer ekspor mendapat `currency = USD`, harga dari `price_usd` (sen),
        pajak dari `exportTaxRate` bila term ber-`taxProfile` export, fee hanya yang USD, tanpa kode unik dan voucher
        (409 VOUCHER_INVALID reason `currency`), metode bayar hanya `manual_transfer`. `paymentTermCode` (ASUMSI A-87) opsional di quote;
        bila dikirim harus aktif dan sesuai pasar.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/QuoteResult' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: INSUFFICIENT_STOCK (meta.items[] { productSlug, requested, available }) atau VOUCHER_INVALID (meta.reason in not_found|inactive|expired|not_started|quota|per_user_limit|min_subtotal|scope|not_eligible|currency)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { description: 'VALIDATION_ERROR: produk tidak ada/unpublished/price_mode=quote/tanpa harga dalam mata uang customer (items.N.productSlug), qty < moq (items.N.qty), shippingRateId tidak berlaku, paymentMethodCode tidak aktif atau bukan manual_transfer untuk order USD, addressId bukan milik user, deliveryTermCode tidak ada/nonaktif/beda pasar atau tidak ada term aktif sama sekali, paymentTermCode tidak ada/nonaktif/beda pasar', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------- admin katalog (kontrak 11.3)
  /admin/categories:
    get:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Semua kategori (modul categories) + productCount termasuk produk soft-deleted
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Category' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/categories/{category}:
    put:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Category' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '409': { description: CATEGORY_IN_USE (masih ada produk, termasuk soft-deleted), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/products:
    get:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Daftar produk (modul products), paginated
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: slug atau id }
        - { name: published, in: query, schema: { type: boolean } }
        - { name: trashed, in: query, schema: { type: boolean }, description: sertakan produk soft-deleted }
        - { name: page, in: query, schema: { type: integer } }
        - { name: perPage, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
    post:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Buat produk (+ images[] mediaId foto/video berurutan, thumbnailMediaId). Stok awal lewat POST /admin/products/{product}/stock.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminProduct' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{product}:
    get:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: product, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminProduct' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Ubah produk; images[] (bila dikirim) menggantikan seluruh daftar gambar
      parameters: [{ name: product, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminProduct' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Soft delete (ledger dan order_items tetap merujuk produk)
      parameters: [{ name: product, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/products/{product}/publish:
    put:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: product, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isPublished], properties: { isPublished: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminProduct' } } } } } }
  /admin/products/{product}/stock:
    get:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Ledger stok berpaginasi + ringkasan (modul stock)
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: perPage, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/StockSummary'
                      - type: object
                        properties:
                          movements: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: 'Mutasi stok lewat StockLedger: in (qty > 0) atau adjust (qty ± , tidak boleh membuat available < 0)'
      parameters: [{ name: product, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, qty]
              properties:
                type: { type: string, enum: [in, adjust] }
                qty: { type: integer, description: 'in: > 0; adjust: bertanda, bukan 0' }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/StockSummary'
                      - type: object
                        properties:
                          movement: { $ref: '#/components/schemas/StockMovement' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/reviews:
    get:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Semua ulasan (modul products), paginated
      parameters:
        - { name: q, in: query, schema: { type: string }, description: isi ulasan / nama customer / produk }
        - { name: product, in: query, schema: { type: string }, description: slug atau id produk }
        - { name: published, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Review' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
  /admin/reviews/{review}:
    put:
      tags: [admin-catalog]
      security: [{ cookieAuth: [] }]
      summary: Sembunyikan/tampilkan ulasan (rating_avg/review_count produk dihitung ulang)
      parameters: [{ name: review, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isPublished], properties: { isPublished: { type: boolean } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Review' } } } } } }

  # ---------------------------------------------------------------- admin konfigurasi commerce (kontrak 11.5)
  /admin/bank-accounts:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankAccount' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/bank-accounts/{bankAccount}:
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: bankAccount, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankAccount' } } } } } }
    delete:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: bankAccount, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/customer-options:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Daftar ringkas customer aktif untuk pemilih sasaran voucher/biaya (maks. 20; modul customers, vouchers, atau fees)
      parameters: [{ name: q, in: query, schema: { type: string }, description: ILIKE nama/email/perusahaan }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerOption' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/fees:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Fee' } } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Fee' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/fees/{fee}:
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: fee, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FeeInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Fee' } } } } } }
    delete:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: fee, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/shipping-zones:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Zona + regions[] + rates[] (modul shipping), urut priority desc
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShippingZone' } } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShippingZoneInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingZone' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/shipping-zones/{shippingZone}:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: shippingZone, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingZone' } } } } } }
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Ubah zona; regions[] (bila dikirim) menggantikan seluruh daftar wilayah
      parameters: [{ name: shippingZone, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShippingZoneInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingZone' } } } } } }
    delete:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Hapus zona beserta regions dan rates
      parameters: [{ name: shippingZone, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/shipping-zones/{shippingZone}/rates:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: shippingZone, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShippingRate' } } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: shippingZone, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShippingRateInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingRate' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/shipping-rates/{shippingRate}:
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: shippingRate, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShippingRateInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingRate' } } } } } }
    delete:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: shippingRate, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  # ---------------------------------------------------------------- lokasi pabrik (kontrak 11.8, ASUMSI A-90)
  /admin/factory-locations:
    get:
      tags: [admin-commerce-config]
      summary: Semua lokasi pabrik (urut sortOrder; pertama = bawaan) + productsCount (modul shipping, ASUMSI A-90)
      description: |
        Pabrik = titik asal ongkir per km (Franco: keranjang dipecah per pabrik asal item, lihat ShippingRateQuote.origins) dan
        titik ambil Loco (allowsPickup). Menggantikan /admin/shipping-origin dan /admin/pickup-location (dihapus). Faktor jalan
        tetap setting `shipping_road_factor`: /admin/shipping/road-factor (modul shipping) atau /admin/settings `shippingRoadFactor`.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminFactoryLocation' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-commerce-config]
      summary: Tambah lokasi pabrik (kode slug unik, dinormalkan lowercase; tidak bisa diubah setelahnya)
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FactoryLocationInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminFactoryLocation' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/factory-locations/{factoryLocation}:
    put:
      tags: [admin-commerce-config]
      summary: Ubah lokasi pabrik (penggantian penuh; kode boleh dikirim bila sama, kode lain → 422 code; lat/lng tidak dikirim = dikosongkan)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: factoryLocation, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FactoryLocationInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminFactoryLocation' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-commerce-config]
      summary: Hapus lokasi pabrik; ditolak bila masih dipakai produk (products.factory_location_id) atau tinggal satu baris
      security: [{ cookieAuth: [] }]
      parameters: [{ name: factoryLocation, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'FACTORY_LOCATION_IN_USE (dipakai produk, atau baris terakhir)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/shipping/road-factor:
    get:
      tags: [admin-commerce-config]
      summary: Faktor jalan ongkir per km (modul shipping; setting commerce shipping_road_factor, sama dengan /admin/settings shippingRoadFactor)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingRoadFactor' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-commerce-config]
      summary: Ubah faktor jalan (jarak jalan ≈ garis lurus pabrik → alamat × faktor, ASUMSI A-76/A-90)
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShippingRoadFactor' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShippingRoadFactor' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ---------------------------------------------------------------- cara serah terima (kontrak 11.8, ASUMSI A-85)
  /admin/delivery-terms:
    get:
      tags: [admin-commerce-config]
      summary: Semua cara serah terima (aktif + nonaktif, urut sortOrder) + ordersCount (modul shipping)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminDeliveryTerm' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-commerce-config]
      summary: Tambah cara serah terima (kode slug unik, dinormalkan lowercase; tidak bisa diubah setelahnya)
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryTermInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminDeliveryTerm' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/delivery-terms/{deliveryTerm}:
    put:
      tags: [admin-commerce-config]
      summary: Ubah cara serah terima (kode boleh dikirim bila sama; kode lain → 422 code)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: deliveryTerm, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryTermInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminDeliveryTerm' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-commerce-config]
      summary: Hapus cara serah terima; ditolak bila sudah dipakai order (nonaktifkan saja lewat isActive)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: deliveryTerm, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: DELIVERY_TERM_IN_USE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/shipping-methods:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: 'Alias kompatibilitas: semua tarif lintas zona (label = name, zone { id, name })'
      parameters: [{ name: active, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ShippingRate' } } } } } } }
  /admin/vouchers:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: kode }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: audience, in: query, schema: { type: string, enum: [all, customers] }, description: sasaran voucher }
        - { name: page, in: query, schema: { type: integer } }
        - { name: perPage, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Voucher' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VoucherInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Voucher' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/vouchers/{voucher}:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: voucher, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Voucher' } } } } } }
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: voucher, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VoucherInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Voucher' } } } } } }
    delete:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: voucher, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/payment-methods:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Semua metode bayar (modul payment_methods) + config non-rahasia + qrisImageUrl
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } } } } } } }
    post:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethodInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PaymentMethod' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-methods/{paymentMethod}:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: paymentMethod, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PaymentMethod' } } } } } }
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Ubah metode bayar (tidak ada DELETE; nonaktifkan lewat isActive). config dipertahankan bila tidak dikirim.
      parameters: [{ name: paymentMethod, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethodInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/PaymentMethod' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  # ---------------------------------------------------------------- syarat pembayaran ekspor (kontrak 11.10, ASUMSI A-87)
  /admin/payment-terms:
    get:
      tags: [admin-commerce-config]
      summary: Semua syarat pembayaran (aktif + nonaktif, urut sortOrder) + ordersCount (modul payment_methods)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminPaymentTerm' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-commerce-config]
      summary: Tambah syarat pembayaran (kode slug unik, dinormalkan lowercase; tidak bisa diubah setelahnya)
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentTermInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminPaymentTerm' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/payment-terms/{paymentTerm}:
    put:
      tags: [admin-commerce-config]
      summary: Ubah syarat pembayaran (kode boleh dikirim bila sama; kode lain → 422 code)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: paymentTerm, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentTermInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminPaymentTerm' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-commerce-config]
      summary: Hapus syarat pembayaran; ditolak bila sudah dipakai order (nonaktifkan saja lewat isActive)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: paymentTerm, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: PAYMENT_TERM_IN_USE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/settings:
    get:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Pengaturan commerce (modul settings). Pengaturan situs ada di /admin/site-settings.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceSettings' } } } } } }
    put:
      tags: [admin-commerce-config]
      security: [{ cookieAuth: [] }]
      summary: Ubah sebagian/seluruh pengaturan commerce (kunci asing diabaikan)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CommerceSettings' } } } }
      responses:
        '200': { description: '{ data, message }', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CommerceSettings' }, message: { type: string } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { $ref: '#/components/schemas/I18n' }
        description: { $ref: '#/components/schemas/I18n' }
        image: { $ref: '#/components/schemas/MediaSummary', nullable: true }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        productCount: { type: integer, description: 'publik: produk published; admin: termasuk soft-deleted' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name]
      properties:
        slug: { type: string, maxLength: 120, description: dibuat dari name.id bila kosong }
        name: { $ref: '#/components/schemas/I18n' }
        description: { $ref: '#/components/schemas/I18n' }
        imageMediaId: { type: integer, nullable: true }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    I18nList:
      type: object
      description: Daftar string per bahasa; input boleh string[] (dianggap id) — en kosong diisi dari id
      properties:
        id: { type: array, items: { type: string } }
        en: { type: array, items: { type: string } }
    ProductImage:
      type: object
      description: Media produk, foto atau video (ASUMSI A-72)
      properties:
        id: { type: integer, description: media id }
        url: { type: string }
        sort: { type: integer }
        type: { type: string, enum: [image, video] }
        mime: { type: string, nullable: true }
        isThumbnail: { type: boolean, description: foto yang dipilih admin sebagai thumbnail }
    Product:
      type: object
      description: |
        Bentuk publik (kontrak bagian 6). Uang integer satuan terkecil `currency` (ASUMSI A-86): pengunjung umum dan customer
        lokal mendapat `currency = IDR` + `price/promoPrice/promoEndsAt/effectivePrice` (rupiah); customer ekspor yang login mendapat
        `currency = USD` + `priceUsd` (sen, basis FOB Belawan, tanpa promo) dan field rupiah TIDAK dikirim. Tamu tidak pernah melihat USD.
      properties:
        id: { type: integer }
        slug: { type: string }
        code: { type: string }
        name: { $ref: '#/components/schemas/I18n' }
        category: { type: object, nullable: true, properties: { slug: { type: string }, name: { $ref: '#/components/schemas/I18n' } } }
        kind: { type: string, nullable: true }
        factory: { allOf: [{ $ref: '#/components/schemas/FactoryBrief' }], nullable: true, description: 'pabrik asal (ASUMSI A-90); produk tanpa pabrik = pabrik bawaan' }
        priceMode: { type: string, enum: [fixed, quote] }
        currency: { type: string, enum: [IDR, USD], description: 'mata uang field harga di objek ini (mengikuti pengunjung)' }
        price: { type: integer, nullable: true, description: 'rupiah; null untuk quote; tidak dikirim untuk customer ekspor' }
        promoPrice: { type: integer, nullable: true, description: 'hanya terisi bila promo sedang aktif; tidak dikirim untuk customer ekspor' }
        promoEndsAt: { type: string, format: date-time, nullable: true }
        effectivePrice: { type: integer, nullable: true, description: 'promoPrice bila aktif, selain itu price; tidak dikirim untuk customer ekspor' }
        priceUsd: { type: integer, nullable: true, description: 'SEN (1250 = USD 12,50), basis FOB Belawan; hanya dikirim ke customer ekspor yang login; null = produk belum bisa dipesan dalam USD' }
        unit: { type: string }
        moq: { type: integer }
        weightGram: { type: integer }
        dimensions: { $ref: '#/components/schemas/ProductDimensions' }
        stock: { type: integer }
        available: { type: integer, description: stock − reserved }
        stockStatus: { type: string, enum: [in_stock, made_to_order, out_of_stock] }
        isTaxable: { type: boolean }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
        image: { type: string, nullable: true, description: 'URL thumbnail: foto pilihan admin atau foto pertama; tidak pernah video' }
        hasVideo: { type: boolean }
        summary: { $ref: '#/components/schemas/I18n' }
        highlights: { $ref: '#/components/schemas/I18nList' }
        specs: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        applications: { $ref: '#/components/schemas/I18nList' }
        solubility: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        aliases: { type: array, items: { type: string } }
        ratingAvg: { type: number, example: 4.5 }
        reviewCount: { type: integer }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            reviews: { type: array, items: { $ref: '#/components/schemas/Review' }, description: 10 ulasan tayang terbaru }
            related: { type: array, items: { $ref: '#/components/schemas/Product' }, description: maks 4 produk published kategori sama }
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            categoryId: { type: integer }
            category: { type: object, properties: { id: { type: integer }, slug: { type: string }, name: { $ref: '#/components/schemas/I18n' } } }
            factoryLocationId: { type: integer, nullable: true, description: 'nilai tersimpan; null = ikut pabrik bawaan (ASUMSI A-90)' }
            factoryLocation: { type: object, nullable: true, description: 'pabrik efektif (null di kolom = pabrik bawaan)', properties: { id: { type: integer }, code: { type: string }, name: { $ref: '#/components/schemas/I18n' } } }
            currency: { type: string, enum: [IDR], description: 'bentuk admin selalu rupiah + priceUsd terpisah' }
            priceUsd: { type: integer, nullable: true, description: 'SEN (1250 = USD 12,50), basis FOB Belawan; null bila belum diisi atau quote' }
            priceUsdSet: { type: boolean, description: 'true bila harga USD terisi (produk bisa dipesan customer ekspor)' }
            promoPrice: { type: integer, nullable: true, description: nilai tersimpan (tanpa memandang periode) }
            promoStartsAt: { type: string, format: date-time, nullable: true }
            promoEndsAt: { type: string, format: date-time, nullable: true }
            promoActive: { type: boolean }
            reserved: { type: integer }
            isPublished: { type: boolean }
            images:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ProductImage'
                  - type: object
                    properties:
                      mediaId: { type: integer }
                      media: { $ref: '#/components/schemas/MediaSummary' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deletedAt: { type: string, format: date-time, nullable: true }
    ProductInput:
      type: object
      required: [code, categoryId, name, priceMode]
      properties:
        slug: { type: string, maxLength: 160, description: dibuat dari name.id bila kosong }
        code: { type: string, maxLength: 64 }
        categoryId: { type: integer }
        factoryLocationId: { type: integer, nullable: true, description: 'id dari /admin/factory-locations (ASUMSI A-90); null = pabrik bawaan; tidak dikirim saat PUT = tetap' }
        name: { $ref: '#/components/schemas/I18n' }
        kind: { type: string, maxLength: 120 }
        summary: { $ref: '#/components/schemas/I18n' }
        highlights: { $ref: '#/components/schemas/I18nList' }
        specs: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        applications: { $ref: '#/components/schemas/I18nList' }
        solubility: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        aliases: { type: array, items: { type: string } }
        priceMode: { type: string, enum: [fixed, quote] }
        price: { type: integer, minimum: 0, description: wajib bila priceMode=fixed; diabaikan untuk quote }
        promoPrice: { type: integer, minimum: 0, nullable: true }
        priceUsd: { type: integer, minimum: 0, nullable: true, description: 'harga USD per satuan dalam SEN (1250 = USD 12,50), basis FOB Belawan (ASUMSI A-86); tidak dikirim = tetap, null = dikosongkan, diabaikan untuk quote' }
        promoStartsAt: { type: string, format: date-time, nullable: true }
        promoEndsAt: { type: string, format: date-time, nullable: true }
        unit: { type: string, maxLength: 32, default: pcs }
        moq: { type: integer, minimum: 1, default: 1 }
        weightGram: { type: integer, minimum: 1, default: 1000 }
        lengthCm: { type: number, minimum: 0.1, maximum: 100000, nullable: true, description: 'dimensi kemasan per satuan jual (cm, 1 desimal); tidak dikirim = tetap, null = dikosongkan' }
        widthCm: { type: number, minimum: 0.1, maximum: 100000, nullable: true }
        heightCm: { type: number, minimum: 0.1, maximum: 100000, nullable: true }
        stockStatus: { type: string, enum: [in_stock, made_to_order, out_of_stock], description: 'hanya made_to_order yang bertahan; lainnya diturunkan dari available' }
        isTaxable: { type: boolean, default: true }
        isPublished: { type: boolean, default: false }
        images: { type: array, maxItems: 20, items: { type: integer }, description: 'media id foto/video berurutan (sort_order = indeks); media harus disk public bertipe image/* atau video/*' }
        thumbnailMediaId: { type: integer, nullable: true, description: 'foto di dalam images[] yang menjadi thumbnail; null = foto pertama; tidak dikirim = tanda yang ada dipertahankan' }
        imageFrames:
          type: object
          nullable: true
          description: 'Bingkai per id media (A-93) {"<mediaId>": MediaFrame}; dikirim = semua bingkai diganti (id tanpa entri = bawaan), tidak dikirim = dipertahankan. Respons: images[].frame dan imageFrame (bingkai thumbnail).'
          additionalProperties: { $ref: '#/components/schemas/MediaFrame' }
    Review:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productSlug: { type: string }
        productName: { $ref: '#/components/schemas/I18n' }
        userId: { type: integer }
        customer: { type: string, nullable: true, description: nama user }
        orderId: { type: integer, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        isPublished: { type: boolean }
        date: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    StockSummary:
      type: object
      properties:
        product: { type: object, properties: { id: { type: integer }, slug: { type: string }, code: { type: string }, name: { $ref: '#/components/schemas/I18n' } } }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        stockStatus: { type: string, enum: [in_stock, made_to_order, out_of_stock] }
    StockMovement:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        type: { type: string, enum: [in, adjust, reserve, release, commit] }
        qty: { type: integer, description: 'bertanda: in/adjust ±, reserve +, release/commit −' }
        referenceType: { type: string, nullable: true, example: order }
        referenceId: { type: integer, nullable: true }
        idempotencyKey: { type: string, nullable: true, example: 'order:43:reserve:3' }
        note: { type: string, nullable: true }
        createdBy: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
    QuoteRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [qty]
            properties:
              productSlug: { type: string }
              productId: { type: integer, description: alternatif productSlug }
              qty: { type: integer, minimum: 1 }
        deliveryTermCode: { type: string, nullable: true, maxLength: 32, example: loco, description: 'kode cara serah terima aktif pasar customer; kosong = term aktif pertama (sortOrder)' }
        paymentTermCode: { type: string, nullable: true, maxLength: 32, example: tt_advance, description: 'syarat pembayaran aktif pasar customer (ASUMSI A-87); opsional di quote' }
        addressId: { type: integer, nullable: true, description: 'dipakai hanya untuk term pricingMode zone' }
        shippingRateId: { type: integer, nullable: true, description: 'dipakai hanya untuk term pricingMode zone' }
        paymentMethodCode: { type: string, nullable: true, example: manual_transfer }
        bankAccountId: { type: integer, nullable: true, description: diterima, tidak dipakai quote }
        voucherCode: { type: string, nullable: true }
        note: { type: string, nullable: true }
    QuoteItem:
      type: object
      properties:
        productId: { type: integer }
        productSlug: { type: string }
        code: { type: string }
        name: { $ref: '#/components/schemas/I18n' }
        unit: { type: string }
        image: { type: string, nullable: true }
        categoryId: { type: integer }
        qty: { type: integer }
        moq: { type: integer }
        unitPrice: { type: integer, description: 'harga berlaku dalam satuan terkecil currency (IDR: promo bila aktif; USD: price_usd dalam sen)' }
        basePrice: { type: integer }
        promoApplied: { type: boolean, description: selalu false untuk USD }
        lineTotal: { type: integer }
        discountAmount: { type: integer, description: alokasi proporsional diskon voucher }
        taxAmount: { type: integer }
        isTaxable: { type: boolean }
        weightGram: { type: integer, description: berat × qty }
        available: { type: integer }
        factory: { allOf: [{ $ref: '#/components/schemas/FactoryBrief' }], nullable: true, description: 'pabrik asal item (ASUMSI A-90)' }
    ShippingRateQuote:
      type: object
      description: 'Tarif zona terpilih (type flat|calculated), baris sintetis term tanpa ongkir (type pickup|included: rateId/zoneId null, amount 0, label = nama term, breakdown null), atau CIF (type quoted, ASUMSI A-89: amount 0 sementara, destinationPort bila dikirim checkout; ongkir final dari penawaran admin)'
      properties:
        rateId: { type: integer, nullable: true }
        zoneId: { type: integer, nullable: true }
        label: { $ref: '#/components/schemas/I18n' }
        eta: { $ref: '#/components/schemas/I18n', nullable: true }
        amount: { type: integer }
        type: { type: string, enum: [flat, calculated, pickup, included, quoted] }
        destinationPort: { type: object, nullable: true, description: 'hanya type quoted: { name, country, countryCode, lat, lng } dari checkout; null di /cart/quote' }
        available: { type: boolean, description: 'false = tarif per km tanpa titik peta alamat atau pabrik asal (tidak ikut availableShippingRates)' }
        distanceKm: { type: integer, nullable: true, description: 'jarak jalan perkiraan (km, dibulatkan ke atas) = haversine pabrik asal → titik peta alamat × faktor jalan; keranjang multi pabrik = jarak terjauh; null bila tarif tidak memakai jarak' }
        weightGram: { type: integer }
        volumeCm3: { type: integer }
        breakdown: { $ref: '#/components/schemas/ShippingBreakdown', description: 'tarif zona: jumlah bagian semua origins (minimumApplied = ada origin yang kena minimum); null untuk baris sintetis' }
        origins: { type: array, items: { $ref: '#/components/schemas/ShippingOrigin' }, description: 'hanya tarif zona (ASUMSI A-90): satu baris per pabrik asal, urut daftar pabrik; amount = Σ origins.amount' }
    QuoteResult:
      type: object
      description: 'Semua uang integer satuan terkecil `currency` (IDR rupiah bulat, USD sen; ASUMSI A-86)'
      properties:
        currency: { type: string, enum: [IDR, USD], description: 'dari pasar customer: export = USD' }
        items: { type: array, items: { $ref: '#/components/schemas/QuoteItem' } }
        subtotal: { type: integer }
        discountTotal: { type: integer }
        voucher: { type: object, nullable: true, properties: { id: { type: integer }, code: { type: string }, type: { type: string, enum: [percent, fixed] }, value: { type: number } } }
        deliveryTerm: { allOf: [{ $ref: '#/components/schemas/DeliveryTerm' }], nullable: true, description: 'cara serah terima yang dipakai quote (ASUMSI A-85)' }
        paymentTerm: { allOf: [{ $ref: '#/components/schemas/PaymentTerm' }], nullable: true, description: 'syarat pembayaran yang dikirim (ASUMSI A-87); null bila tidak dikirim' }
        shipping: { $ref: '#/components/schemas/ShippingRateQuote', nullable: true }
        availableShippingRates: { type: array, items: { $ref: '#/components/schemas/ShippingRateQuote' } }
        shippingTotal: { type: integer }
        fees: { type: array, items: { type: object, properties: { id: { type: integer }, name: { $ref: '#/components/schemas/I18n' }, type: { type: string }, amount: { type: integer }, currency: { type: string, enum: [IDR, USD] } } }, description: 'hanya fee se-mata-uang dengan order' }
        feeTotal: { type: integer }
        taxRate: { type: number, example: 11, description: 'taxRate (domestic) atau exportTaxRate bila term ber-taxProfile export (ASUMSI A-86)' }
        priceIncludesTax: { type: boolean }
        taxTotal: { type: integer, description: informasi bila inklusif; ditambahkan ke grandTotal bila eksklusif }
        paymentMethodCode: { type: string, nullable: true }
        uniqueCodeRequired: { type: boolean, description: 'manual_transfer + setting uniqueCodeEnabled; selalu false untuk USD' }
        uniqueCode: { type: integer, description: 'sementara 1–999 (0 bila tidak berlaku); final ditetapkan saat checkout' }
        grandTotal: { type: integer, description: subtotal − diskon + ongkir + fee + (pajak bila eksklusif) + uniqueCode }
        weightGram: { type: integer }
        volumeCm3: { type: integer, description: 'Σ dimensi produk × qty (cm³); 0 bila dimensi produk kosong' }
        pickupPoints: { type: array, items: { $ref: '#/components/schemas/PickupPoint' }, description: 'term Loco (ASUMSI A-90): satu titik ambil per pabrik asal item; [] untuk term lain' }
        warningMeta: { type: object, description: 'rincian warning; {} bila tidak ada', properties: { factory_location_unset: { type: object, properties: { factoryCodes: { type: array, items: { type: string }, example: [sei-bamban] } } } } }
        warnings: { type: array, items: { type: string, enum: [no_shipping_rate, shipping_rate_ignored_without_address, distance_unavailable, factory_location_unset, freight_quote_pending] }, description: 'distance_unavailable = tarif per km disembunyikan karena alamat belum punya titik peta; factory_location_unset (ASUMSI A-90, menggantikan shipping_origin_unset) = pabrik asal item belum punya koordinat (kode di warningMeta); freight_quote_pending = term CIF (pricingMode quoted, ASUMSI A-89): ongkir ditawarkan admin setelah order dibuat, grandTotal sementara tanpa ongkir' }
    PaymentMethodPublic:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: manual_transfer }
        type: { type: string, enum: [manual_transfer, qris_static, qris_dynamic, virtual_account, ewallet] }
        driver: { type: string, enum: [manual, xendit] }
        name: { $ref: '#/components/schemas/I18n' }
        instructions: { $ref: '#/components/schemas/I18n' }
        qrisImageUrl: { type: string, nullable: true, description: hanya qris_static }
        sortOrder: { type: integer }
    CommerceConfig:
      type: object
      properties:
        market: { type: string, enum: [local, export], description: 'pasar pengunjung (customer ekspor login = export; tamu/admin/lokal = local), ASUMSI A-86' }
        currency: { type: string, enum: [IDR, USD], description: 'mata uang pengunjung: export = USD' }
        paymentMethods: { type: array, items: { $ref: '#/components/schemas/PaymentMethodPublic' }, description: 'order USD hanya boleh memakai type manual_transfer (FE menyaring)' }
        bankAccounts: { type: array, items: { type: object, properties: { id: { type: integer }, bankName: { type: string }, accountNumber: { type: string }, accountHolder: { type: string }, currency: { type: string, enum: [IDR, USD] }, swiftCode: { type: string, nullable: true }, bankAddress: { type: string, nullable: true }, correspondentBank: { type: string, nullable: true }, isActive: { type: boolean } } }, description: 'semua rekening aktif; FE menyaring sesuai currency order' }
        fees: { type: array, items: { $ref: '#/components/schemas/Fee' }, description: 'fee untuk semua customer se-mata-uang dengan pengunjung' }
        paymentDueHours: { type: integer, description: order IDR }
        exportPaymentDueHours: { type: integer, description: 'order USD (setting exportPaymentDueHours, ASUMSI A-86)' }
        taxRate: { type: number, description: 'term ber-taxProfile domestic' }
        exportTaxRate: { type: number, description: 'term ber-taxProfile export (FOB/CIF), bawaan 0' }
        priceIncludesTax: { type: boolean }
        uniqueCodeEnabled: { type: boolean, description: 'hanya order IDR' }
        autoCompleteDays: { type: integer }
        deliveryTerms: { type: array, items: { $ref: '#/components/schemas/DeliveryTerm' }, description: 'cara serah terima aktif pasar pengunjung, urut sortOrder (ASUMSI A-85, A-86)' }
        paymentTerms: { type: array, items: { $ref: '#/components/schemas/PaymentTerm' }, description: 'syarat pembayaran aktif pasar pengunjung (ASUMSI A-87); bawaan hanya untuk ekspor, jadi [] untuk tamu/lokal' }
        factories: { type: array, items: { $ref: '#/components/schemas/FactoryLocation' }, description: 'semua lokasi pabrik urut sortOrder (ASUMSI A-90); titik ambil Loco = pabrik asal item yang allowsPickup' }
        pickup: { allOf: [{ $ref: '#/components/schemas/PickupLocation' }], nullable: true, description: 'pabrik bawaan (urutan pertama) dalam bentuk lama, label = nama dalam bahasa request; gunakan factories[] untuk data baru' }
        invoice: { type: object, description: 'teks cetakan invoice (penanda tangan, tembusan) untuk halaman cetak', properties: { signerName: { type: string }, signerTitle: { type: string }, cc: { type: string } } }
    BankAccount:
      type: object
      description: 'Rekening USD (ASUMSI A-86) membawa SWIFT, alamat bank, bank koresponden untuk instruksi bayar dan invoice ekspor'
      properties:
        id: { type: integer }
        bankName: { type: string }
        accountNumber: { type: string }
        accountHolder: { type: string }
        currency: { type: string, enum: [IDR, USD] }
        swiftCode: { type: string, nullable: true, example: BMRIIDJA }
        bankAddress: { type: string, nullable: true }
        correspondentBank: { type: string, nullable: true }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BankAccountInput:
      type: object
      required: [bankName, accountNumber, accountHolder]
      properties:
        bankName: { type: string, maxLength: 120 }
        accountNumber: { type: string, maxLength: 64 }
        accountHolder: { type: string, maxLength: 160 }
        currency: { type: string, enum: [IDR, USD], default: IDR, description: 'tidak dikirim saat PUT = tetap' }
        swiftCode: { type: string, nullable: true, maxLength: 16, pattern: '^[A-Z0-9]{8}([A-Z0-9]{3})?$', description: 'dinormalkan uppercase tanpa spasi; tidak dikirim saat PUT = tetap, kosong = dihapus' }
        bankAddress: { type: string, nullable: true, maxLength: 255 }
        correspondentBank: { type: string, nullable: true, maxLength: 160 }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer }
    Fee:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/I18n' }
        type: { type: string, enum: [admin, other] }
        currency: { type: string, enum: [IDR, USD], description: 'fee hanya dikenakan ke order se-mata-uang (ASUMSI A-86)' }
        amount: { type: integer, description: 'satuan terkecil currency (IDR rupiah, USD sen)' }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        audience: { type: string, enum: [all, customers], description: 'all = setiap order; customers = hanya order customer di `customers` (bentuk admin saja)' }
        customers: { type: array, items: { $ref: '#/components/schemas/CustomerOption' }, description: bentuk admin saja }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeeInput:
      type: object
      required: [name, amount]
      properties:
        name: { $ref: '#/components/schemas/I18n' }
        type: { type: string, enum: [admin, other], default: other }
        currency: { type: string, enum: [IDR, USD], default: IDR, description: 'tidak dikirim saat PUT = tetap' }
        amount: { type: integer, minimum: 0, description: 'satuan terkecil currency (USD dalam sen)' }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer }
        audience: { type: string, enum: [all, customers], default: all, description: 'tidak dikirim saat PUT = sasaran tidak diubah' }
        customerIds: { type: array, items: { type: integer }, description: 'wajib minimal satu bila audience=customers; id user ber-role customer' }
    CustomerOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        company: { type: string, nullable: true }
        email: { type: string }
    ShippingZone:
      type: object
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/I18n' }
        isActive: { type: boolean }
        isDefault: { type: boolean, description: zona cadangan bila alamat tidak cocok zona mana pun }
        priority: { type: integer, description: lebih besar menang saat level wilayah sama }
        regions: { type: array, items: { type: object, properties: { code: { type: string, example: '12.71' }, level: { type: string, enum: [province, regency, district, village] } } } }
        rates: { type: array, items: { $ref: '#/components/schemas/ShippingRate' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShippingZoneInput:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/I18n' }
        isActive: { type: boolean, default: true }
        isDefault: { type: boolean, default: false }
        priority: { type: integer, default: 0 }
        regions: { type: array, items: { type: object, required: [code, level], properties: { code: { type: string, maxLength: 16 }, level: { type: string, enum: [province, regency, district, village] } } } }
    ShippingRate:
      type: object
      description: 'flat: amount = baseAmount. calculated (ASUMSI A-76): amount = max(minAmount, baseAmount + perKmAmount × ⌈km⌉ + perKgAmount × ⌈kg⌉ + perM3Amount × m³ (dibulatkan ke atas per 0,01 m³)); 0 bila subtotal − diskon ≥ freeAbove'
      properties:
        id: { type: integer }
        zoneId: { type: integer }
        zone: { type: object, properties: { id: { type: integer }, name: { $ref: '#/components/schemas/I18n' } } }
        name: { $ref: '#/components/schemas/I18n' }
        label: { $ref: '#/components/schemas/I18n', description: sama dengan name (alias FE lama) }
        type: { type: string, enum: [flat, calculated] }
        baseAmount: { type: integer }
        perKmAmount: { type: integer }
        perKgAmount: { type: integer }
        perM3Amount: { type: integer }
        minAmount: { type: integer }
        freeAbove: { type: integer, nullable: true }
        eta: { $ref: '#/components/schemas/I18n', nullable: true }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShippingOrigin:
      type: object
      description: 'Rincian ongkir satu pabrik asal (ASUMSI A-90): ShippingRate::breakdown dengan berat/volume item pabrik itu dan jarak dari pabrik itu; base dan minAmount berlaku per pabrik, freeAbove terhadap subtotal seluruh order'
      properties:
        factory: { allOf: [{ $ref: '#/components/schemas/FactoryBrief' }], nullable: true }
        weightGram: { type: integer }
        volumeCm3: { type: integer }
        distanceKm: { type: integer, nullable: true, description: 'null bila tarif tidak memakai jarak' }
        amount: { type: integer }
        breakdown: { $ref: '#/components/schemas/ShippingBreakdown' }
    ShippingRoadFactor:
      type: object
      required: [roadFactor]
      properties:
        roadFactor: { type: number, minimum: 1, maximum: 3, example: 1.3, description: 'dibulatkan 2 desimal' }
    FactoryBrief:
      type: object
      properties:
        code: { type: string, example: sei-bamban }
        name: { $ref: '#/components/schemas/I18n' }
    FactoryLocation:
      type: object
      description: 'Lokasi pabrik, bentuk publik (GET /commerce/config factories[], ASUMSI A-90)'
      properties:
        code: { type: string, example: tanjung-morawa }
        name: { $ref: '#/components/schemas/I18n' }
        address: { type: string, example: 'Jl. Medan - Tanjung Morawa Km 9,5, Medan 20148, Sumatera Utara, Indonesia' }
        lat: { type: number, nullable: true, example: 3.5387 }
        lng: { type: number, nullable: true, example: 98.7467 }
        allowsPickup: { type: boolean, description: 'false = keranjang berisi item pabrik ini tidak bisa Loco (422 deliveryTermCode)' }
    AdminFactoryLocation:
      allOf:
        - { $ref: '#/components/schemas/FactoryLocation' }
        - type: object
          properties:
            id: { type: integer }
            sortOrder: { type: integer }
            isDefault: { type: boolean, description: 'urutan pertama = pabrik untuk produk tanpa factoryLocationId' }
            productsCount: { type: integer, description: 'produk (tidak terhapus) yang menunjuk pabrik ini' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    FactoryLocationInput:
      type: object
      required: [name, address]
      properties:
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9-]*$', description: 'wajib saat POST (dinormalkan lowercase); PUT hanya boleh sama' }
        name: { $ref: '#/components/schemas/I18n' }
        address: { type: string, maxLength: 255 }
        lat: { type: number, minimum: -90, maximum: 90, nullable: true, description: 'wajib bersama lng; dibulatkan 6 desimal; null = tanpa pin (tarif per km tidak ditawarkan untuk item pabrik ini)' }
        lng: { type: number, minimum: -180, maximum: 180, nullable: true, description: wajib bersama lat }
        allowsPickup: { type: boolean, default: true }
        sortOrder: { type: integer, description: 'kosong saat POST = di akhir daftar' }
    PickupLocation:
      type: object
      description: 'Titik ambil bentuk lama { label, address, lat, lng } (GET /commerce/config pickup = pabrik bawaan, Order.pickup = titik pertama)'
      properties:
        label: { type: string, example: Pabrik Tanjung Morawa }
        address: { type: string, example: 'Jl. Medan - Tanjung Morawa Km 9,5, Medan 20148, Sumatera Utara, Indonesia' }
        lat: { type: number, nullable: true, example: 3.5387 }
        lng: { type: number, nullable: true, example: 98.7467 }
    PickupPoint:
      type: object
      description: 'Titik ambil Loco per pabrik asal (ASUMSI A-90); dibekukan di shippingAddress.points[] saat checkout'
      properties:
        code: { type: string, nullable: true, description: 'kode pabrik; null untuk order sebelum A-90' }
        name: { allOf: [{ $ref: '#/components/schemas/I18n' }], nullable: true }
        label: { type: string, nullable: true, description: 'nama pabrik dalam bahasa customer saat checkout' }
        address: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        items: { type: array, items: { type: string }, description: 'productSlug item yang diambil di titik ini' }
    DeliveryTerm:
      type: object
      description: 'Cara serah terima, bentuk publik (GET /commerce/config, QuoteResult.deliveryTerm). family pickup = Loco (tanpa alamat, ongkir 0, shipped/delivered berarti siap diambil/sudah diambil); door = diantar; port = FOB/CIF ekspor'
      properties:
        code: { type: string, example: loco }
        name: { $ref: '#/components/schemas/I18n' }
        description: { $ref: '#/components/schemas/I18n', nullable: true }
        family: { type: string, enum: [pickup, door, port] }
        market: { type: string, enum: [local, export] }
        pricingMode: { type: string, enum: [none, zone, included, quoted], description: 'none = tanpa ongkir; zone = tarif zona (addressId + shippingRateId wajib); included = termasuk harga; quoted = penawaran admin per order (CIF, ASUMSI A-89: checkout wajib destinationPort, order awaiting_freight sampai penawaran disepakati)' }
        taxProfile: { type: string, enum: [domestic, export], description: 'pajak mengikuti term (ASUMSI A-86): domestic = setting taxRate, export = setting exportTaxRate' }
        insuranceIncluded: { type: boolean }
        loadingPort: { type: string, nullable: true, example: Belawan }
        requiresDestinationPort: { type: boolean }
    AdminDeliveryTerm:
      allOf:
        - { $ref: '#/components/schemas/DeliveryTerm' }
        - type: object
          properties:
            id: { type: integer }
            isActive: { type: boolean }
            sortOrder: { type: integer }
            ordersCount: { type: integer, description: 'jumlah order yang memakai kode ini (hanya di daftar)' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    DeliveryTermInput:
      type: object
      required: [code, name, family, market, pricingMode]
      properties:
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9_-]*$', example: loco, description: 'wajib saat membuat (trim + lowercase sebelum validasi), unik; saat mengubah boleh dikirim bila sama dengan yang ada' }
        name: { $ref: '#/components/schemas/I18n', description: 'id wajib, en diisi dari id bila kosong' }
        description: { $ref: '#/components/schemas/I18n', nullable: true }
        family: { type: string, enum: [pickup, door, port] }
        market: { type: string, enum: [local, export] }
        pricingMode: { type: string, enum: [none, zone, included, quoted] }
        taxProfile: { type: string, enum: [domestic, export], description: 'kosong = export untuk market export, domestic untuk local' }
        insuranceIncluded: { type: boolean, default: false }
        requiresDestinationPort: { type: boolean, default: false }
        loadingPort: { type: string, maxLength: 120, nullable: true }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
    PaymentTerm:
      type: object
      description: 'Syarat pembayaran, bentuk publik (GET /commerce/config, QuoteResult.paymentTerm; ASUMSI A-87). Informasi untuk dokumen; aplikasi tetap menerima satu pembayaran sebesar grand total'
      properties:
        code: { type: string, example: tt_advance }
        name: { $ref: '#/components/schemas/I18n' }
        description: { $ref: '#/components/schemas/I18n', nullable: true }
        market: { type: string, enum: [local, export] }
    AdminPaymentTerm:
      allOf:
        - { $ref: '#/components/schemas/PaymentTerm' }
        - type: object
          properties:
            id: { type: integer }
            isActive: { type: boolean }
            sortOrder: { type: integer }
            ordersCount: { type: integer, description: 'jumlah order yang memakai kode ini (hanya di daftar)' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PaymentTermInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9][a-z0-9_-]*$', example: tt_advance, description: 'wajib saat membuat (trim + lowercase), unik; saat mengubah boleh dikirim bila sama' }
        name: { $ref: '#/components/schemas/I18n', description: 'id wajib, en diisi dari id bila kosong' }
        description: { $ref: '#/components/schemas/I18n', nullable: true }
        market: { type: string, enum: [local, export], default: export }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
    ShippingBreakdown:
      type: object
      properties:
        base: { type: integer }
        distance: { type: integer }
        weight: { type: integer }
        volume: { type: integer }
        minimumApplied: { type: boolean }
        free: { type: boolean }
    ProductDimensions:
      type: object
      properties:
        lengthCm: { type: number, nullable: true }
        widthCm: { type: number, nullable: true }
        heightCm: { type: number, nullable: true }
        volumeCm3: { type: integer, description: 'L × W × H per satuan; 0 bila ada dimensi kosong' }
    ShippingRateInput:
      type: object
      required: [name, type]
      properties:
        zoneId: { type: integer, description: hanya pada PUT untuk memindahkan rate }
        name: { $ref: '#/components/schemas/I18n' }
        type: { type: string, enum: [flat, calculated, per_kg], description: 'per_kg = nama lama, disimpan sebagai calculated' }
        baseAmount: { type: integer, minimum: 0, default: 0 }
        perKmAmount: { type: integer, minimum: 0, default: 0 }
        perKgAmount: { type: integer, minimum: 0, default: 0 }
        perM3Amount: { type: integer, minimum: 0, default: 0 }
        minAmount: { type: integer, minimum: 0, default: 0 }
        freeAbove: { type: integer, minimum: 0, nullable: true }
        eta: { $ref: '#/components/schemas/I18n' }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer }
    Voucher:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: IKN10 }
        type: { type: string, enum: [percent, fixed] }
        value: { type: number, description: persen (percent) atau rupiah (fixed) }
        minSubtotal: { type: integer }
        maxDiscount: { type: integer, nullable: true }
        quota: { type: integer, nullable: true }
        usedCount: { type: integer }
        perUserLimit: { type: integer, nullable: true }
        scope: { type: string, enum: [all, category] }
        categoryIds: { type: array, items: { type: integer } }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }
        audience: { type: string, enum: [all, customers], description: 'all = semua customer; customers = hanya customer di `customers`' }
        customers: { type: array, items: { $ref: '#/components/schemas/CustomerOption' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VoucherInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', description: disimpan huruf besar }
        type: { type: string, enum: [percent, fixed] }
        value: { type: number, description: 'percent: 0–100; fixed: integer rupiah' }
        minSubtotal: { type: integer, minimum: 0 }
        maxDiscount: { type: integer, minimum: 0, nullable: true }
        quota: { type: integer, minimum: 0, nullable: true }
        perUserLimit: { type: integer, minimum: 0, nullable: true }
        scope: { type: string, enum: [all, category], default: all }
        categoryIds: { type: array, items: { type: integer }, description: wajib berisi bila scope=category }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean, default: true }
        audience: { type: string, enum: [all, customers], default: all, description: 'tidak dikirim saat PUT = sasaran tidak diubah' }
        customerIds: { type: array, items: { type: integer }, description: 'wajib minimal satu bila audience=customers; id user ber-role customer' }
    PaymentMethod:
      type: object
      description: Bentuk admin (config non-rahasia apa adanya + qrisImageUrl terhidrasi)
      properties:
        id: { type: integer }
        code: { type: string }
        type: { type: string, enum: [manual_transfer, qris_static, qris_dynamic, virtual_account, ewallet] }
        driver: { type: string, enum: [manual, xendit] }
        name: { $ref: '#/components/schemas/I18n' }
        instructions: { $ref: '#/components/schemas/I18n' }
        config: { $ref: '#/components/schemas/PaymentMethodConfig' }
        qrisImageUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentMethodConfig:
      type: object
      description: 'Whitelist kunci non-rahasia; kunci lain dibuang. Kredensial gateway hanya di .env (XENDIT_SECRET_KEY, XENDIT_CALLBACK_TOKEN).'
      properties:
        qrisMediaId: { type: integer, description: qris_static — media gambar QRIS merchant }
        channelCode: { type: string, description: xendit — mis. QRIS, ID_OVO }
        bankCode: { type: string, description: xendit virtual_account — mis. BCA }
        feePercent: { type: number }
        feeFixed: { type: integer }
    PaymentMethodInput:
      type: object
      required: [code, type, name]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[a-z0-9_]+$' }
        type: { type: string, enum: [manual_transfer, qris_static, qris_dynamic, virtual_account, ewallet] }
        driver: { type: string, enum: [manual, xendit], default: manual }
        name: { $ref: '#/components/schemas/I18n' }
        instructions: { $ref: '#/components/schemas/I18n' }
        config: { $ref: '#/components/schemas/PaymentMethodConfig' }
        isActive: { type: boolean, default: false }
        sortOrder: { type: integer }
    CommerceSettings:
      type: object
      description: 'Disimpan di tabel settings grup commerce (key commerce.<snake_case>, is_public=false); default config ikn.commerce.defaults'
      properties:
        paymentDueHours: { type: integer, minimum: 1, maximum: 720, example: 24 }
        uniqueCodeEnabled: { type: boolean, example: true }
        taxRate: { type: number, minimum: 0, maximum: 100, example: 11 }
        priceIncludesTax: { type: boolean, example: true }
        autoCompleteDays: { type: integer, minimum: 0, maximum: 90, example: 7 }
        reminderHoursBeforeDue: { type: integer, minimum: 0, maximum: 168, example: 2 }
        invoicePrefix: { type: string, maxLength: 40, example: PMS/X/INV/RA, description: 'nomor invoice = {prefix}/{urut per bulan}/{bulan Romawi}/{tahun}; huruf, angka, titik, strip, garis miring' }
        invoiceSignerName: { type: string, maxLength: 120, example: Amalia Nasution }
        invoiceSignerTitle: { type: string, maxLength: 120, example: SEVP Operation }
        invoiceCc: { type: string, maxLength: 120, example: 'ATU, File', description: 'tembusan, dipisah koma' }
        shippingRoadFactor: { type: number, minimum: 1, maximum: 3, description: 'jarak jalan ≈ garis lurus × faktor (A-76). Titik asal ongkir dan titik ambil Loco = /admin/factory-locations (A-90); kunci lama shippingOrigin*/pickup* dihapus' }
        exportTaxRate: { type: number, minimum: 0, maximum: 100, example: 0, description: 'pajak term ber-taxProfile export (FOB/CIF), ASUMSI A-86' }
        exportPaymentDueHours: { type: integer, minimum: 1, maximum: 720, example: 120, description: 'batas bayar order USD (jam)' }
        freightQuoteValidDays: { type: integer, minimum: 1, maximum: 90, example: 7, description: 'masa berlaku bawaan penawaran ongkir CIF bila admin tidak mengisi validUntil (hari), ASUMSI A-89' }
        freightQuoteMaxDays: { type: integer, minimum: 1, maximum: 365, example: 30, description: 'batas tunggu order awaiting_freight tanpa penawaran yang masih berlaku sebelum dibatalkan otomatis oleh orders:freight-expire (hari)' }
