openapi: 3.0.3
info:
  title: IKN API
  version: 1.0.0
  description: |
    API PT Industri Karet Nusantara (Laravel 8.83.29). Envelope sukses `{ data }` (+ `meta` untuk paginasi),
    envelope error `{ message, code, errors?, meta? }`. Field translatable berbentuk `{ id, en }`.
    Auth admin memakai Sanctum cookie SPA: `GET /sanctum/csrf-cookie` lalu `POST /api/v1/auth/admin/login`
    dengan `credentials: include` dan header `X-XSRF-TOKEN`. Ringkasan manusia: plan/02-api-contract.md.
servers:
  - url: http://localhost:8000/api/v1
    description: Dev lokal
tags:
  - name: auth
  - name: content
  - name: forms
  - name: files
  - name: admin-users
  - name: admin-media
  - name: admin-settings
  - name: admin-cms
  - name: admin-content
  - name: admin-wbs
  - name: admin-messages

paths:
  /ping:
    get:
      summary: Health check API
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      time: { type: string, format: date-time, example: '2026-09-22T09:24:00+07:00' }
                      locale: { type: string, enum: [id, en] }

  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      summary: Login customer (sesi cookie). Registrasi/verifikasi email menyusul di phase akun.
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/UserSession' }
        '403': { description: EMAIL_NOT_VERIFIED atau ACCOUNT_NOT_APPROVED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/admin/login:
    post:
      tags: [auth]
      summary: Login admin / super_admin (rate limit 5/menit per IP+email)
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/UserSession' }
        '400': { description: BAD_REQUEST bila request bukan dari origin FE stateful }
        '403': { description: FORBIDDEN bila akun tidak aktif }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/logout:
    post:
      tags: [auth]
      security: [{ cookieAuth: [] }]
      summary: Hapus sesi
      responses:
        '200': { description: '{ data: { ok: true }, message }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [auth]
      security: [{ cookieAuth: [] }]
      summary: User sesi saat ini (admin menyertakan permissions + modules)
      responses:
        '200': { $ref: '#/components/responses/UserSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ---------------------------------------------------------------- batas unggahan
  /upload-limits:
    get:
      tags: [content]
      summary: Batas ukuran unggahan efektif (KB) = config ikn dibatasi upload_max_filesize/post_max_size PHP; FE menolak berkas terlalu besar sebelum mengirim
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imageKb: { type: integer }
                      documentKb: { type: integer }
                      videoKb: { type: integer }
                      proofKb: { type: integer }
                      attachmentKb: { type: integer }
                      wbsKb: { type: integer }
                      serverKb: { type: integer, description: 'batas PHP server (0 = tidak terbatas)' }

  # ---------------------------------------------------------------- konten publik
  /content/site:
    get:
      tags: [content]
      summary: Bundel lintas halaman untuk navbar/footer (settings publik, menu header+footer, blok kontak, doc-links aktif)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings: { $ref: '#/components/schemas/SiteSettings' }
                      menus:
                        type: object
                        properties:
                          header: { $ref: '#/components/schemas/Menu' }
                          footer: { $ref: '#/components/schemas/Menu' }
                      contact: { $ref: '#/components/schemas/ContactInfo', nullable: true }
                      docLinks: { type: array, items: { $ref: '#/components/schemas/DocLink' } }
  /content/settings:
    get:
      tags: [content]
      summary: Setting publik (bersarang per grup)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SiteSettings' } } } } } }
  /content/menus/{location}:
    get:
      tags: [content]
      parameters: [{ name: location, in: path, required: true, schema: { type: string, enum: [header, footer] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Menu' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /content/doc-links:
    get:
      tags: [content]
      parameters: [{ name: category, in: query, schema: { type: string } }]
      responses:
        '200': { description: Daftar doc-link aktif, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DocLink' } } } } } } }
  /content/pages/{slug}:
    get:
      tags: [content]
      summary: Halaman published dengan section yang tampil (media terhidrasi)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Page' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /content/blocks/{key}:
    get:
      tags: [content]
      summary: Alias kompatibilitas ke section tertentu (history, vision-mission, contact)
      parameters: [{ name: key, in: path, required: true, schema: { type: string, enum: [history, vision-mission, contact] } }]
      responses:
        '200': { description: '{ data: { key, type, data: content, updatedAt } }' }
        '404': { $ref: '#/components/responses/NotFound' }
  /content/news:
    get:
      tags: [content]
      parameters:
        - { name: category, in: query, schema: { type: string }, description: slug kategori (lihat /content/news-categories) }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200': { description: Berita terbit tanpa body, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PostSummary' } } } } } } }
  /content/news-categories:
    get:
      tags: [content]
      summary: Kategori berita + jumlah berita terbit (filter di halaman Berita)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PostCategory' } } } } } } }
  /content/news/{slug}:
    get:
      tags: [content]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'Detail + related (maks 3, kategori sama diprioritaskan)', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Post' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /content/gallery:
    get:
      tags: [content]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/GalleryItem' } } } } } } }
  /content/certificates:
    get:
      tags: [content]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Certificate' } } } } } } }
  /content/brochures:
    get:
      tags: [content]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Brochure' } } } } } } }
  /content/customer-logos:
    get:
      tags: [content]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerLogo' } } } } } } }

  # ---------------------------------------------------------------- formulir publik
  /wbs:
    post:
      tags: [forms]
      summary: Kirim laporan WBS (rate limit 5/jam per IP). Lampiran ke disk private.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                isAnonymous: { type: boolean, default: true }
                reporterName: { type: string }
                reporterContact: { type: string, description: wajib bila isAnonymous=false }
                attachment: { type: string, format: binary, description: 'pdf/jpg/png ≤ 10 MB' }
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                body: { type: string }
                isAnonymous: { type: boolean }
                reporterName: { type: string }
                reporterContact: { type: string }
      responses:
        '201': { description: '{ data: { code: "WBS-202609-0001", status: "new", createdAt }, message }' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooMany' }
  /wbs/{code}:
    get:
      tags: [forms]
      summary: Status laporan by kode (tanpa isi)
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ data: { code, status, createdAt, updatedAt } }' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contact:
    post:
      tags: [forms]
      summary: Kirim pesan kontak (rate limit 5/jam per IP)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                subject: { type: string }
                message: { type: string }
                type: { type: string, enum: [contact, quote], default: contact }
                productSlug: { type: string }
      responses:
        '201': { description: '{ data: { id, receivedAt }, message }' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooMany' }

  # ---------------------------------------------------------------- berkas privat
  /files/{media}:
    get:
      tags: [files]
      security: [{ cookieAuth: [] }]
      summary: Unduh berkas privat (MediaPolicy - admin aktif, atau customer pemilik order untuk bukti bayarnya)
      description: >-
        Bisa dibuka langsung di tab browser oleh pengguna yang sudah login: middleware `session.downloads`
        menyalakan sesi walau permintaan tidak membawa Origin/Referer FE (tautan rel=noreferrer, alamat ditempel, muat ulang).
      parameters: [{ name: media, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Isi berkas }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- admin: umum
  /admin/permissions/self:
    get:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      summary: Modul yang boleh diakses admin saat ini
      responses:
        '200': { description: '{ data: { role, modules: string[] } }' }
  /admin/users:
    get:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      summary: Daftar akun admin (super_admin)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } } } } }
    post:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserInput' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminUser' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/modules:
    get:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      summary: Daftar modul untuk form hak akses
      responses:
        '200': { description: '{ data: [ { code, name: {id,en} } ] }' }
  /admin/users/{user}:
    put:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminUser' } } } } } }
        '422': { description: 'Termasuk cannot_deactivate_self pada field active' }
  /admin/help-guide:
    get:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: '{ data: { title, type: url|file, url, file: Media|null } }' }
    post:
      tags: [admin-users]
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, type]
              properties:
                title: { type: string }
                type: { type: string, enum: [url, file] }
                url: { type: string }
                file: { type: string, format: binary }
      responses:
        '200': { description: Sama seperti GET }

  # ---------------------------------------------------------------- admin: media
  /admin/media:
    get:
      tags: [admin-media]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: collection, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [image, video, visual, document] }, description: 'visual = gambar + video; document = selain keduanya' }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: perPage, in: query, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        '200': { description: '{ data: Media[], meta }', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Media' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
    post:
      tags: [admin-media]
      security: [{ cookieAuth: [] }]
      summary: Unggah ke disk public (gambar ≤ 5 MB, dokumen hanya PDF ≤ 10 MB, video mp4/webm ≤ 100 MB; mime dideteksi finfo)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                collection: { type: string, default: general }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Media' } } } } } }
        '413': { description: FILE_TOO_LARGE }
        '415': { description: UNSUPPORTED_MEDIA_TYPE }
  /admin/media/{media}:
    delete:
      tags: [admin-media]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: media, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '409': { description: MEDIA_IN_USE }

  # ---------------------------------------------------------------- admin: settings
  /admin/site-settings:
    get:
      tags: [admin-settings]
      security: [{ cookieAuth: [] }]
      summary: Semua setting situs (termasuk privat). Catatan — /admin/settings dicadangkan untuk pengaturan commerce.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SiteSettings' } } } } } }
    put:
      tags: [admin-settings]
      security: [{ cookieAuth: [] }]
      summary: Perbarui sebagian (bersarang); kunci di luar skema diabaikan
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteSettings' }
      responses:
        '200': { description: '{ data, message }' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- admin: CMS
  /admin/cms/section-types:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      summary: Skema tipe section untuk form admin otomatis
      responses:
        '200': { description: '{ data: { types: { [type]: SectionTypeDef }, groups: { [group]: I18n }, icons: string[] } }. SectionTypeDef = { name, description, pages[] (petunjuk halaman bawaan, bukan pembatas), group (kunci di groups: header|content|showcase|data|contact), fields }. Tipe: page_header, hero, marquee, stats, capabilities, product_highlights, video_gallery, cta, text_visual, timeline, vision_mission, values, org_chart, contact_info, contact_form, contact_summary, link_cards, pillars, info_blocks, wbs_form, customer_logos, certificates, brochures, gallery, news, latest_news, steps, icon_features, faq, spec_table, team, testimonials, image_grid, rich_text.' }
  /admin/pages:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: '{ data: [ { id, slug, title, status, template, sectionCount, isProtected, updatedAt } ] }' }
    post:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageInput' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Page' } } } } } }
  /admin/pages/{page}:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Halaman + semua section (termasuk tersembunyi), content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Page' } } } } } }
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageInput' }
      responses:
        '200': { description: OK }
        '409': { description: PAGE_PROTECTED bila slug halaman bawaan diubah }
    delete:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '409': { description: PAGE_PROTECTED }
  /admin/pages/{page}/sections:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: Section[] }' }
    post:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
                key: { type: string, nullable: true }
                content: { type: object, description: 'divalidasi terhadap skema tipe; media boleh id atau {id}' }
                isVisible: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Section' } } } } } }
        '422': { description: 'VALIDATION_ERROR; tipe tidak dikenal atau konten tidak sesuai skema (errors: content.items.0.title.id, ...)' }
  /admin/pages/{page}/sections/reorder:
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: page, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: integer } } } }
      responses:
        '200': { description: Halaman lengkap terurut }
        '422': { description: id bukan milik halaman }
  /admin/sections/{section}:
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: section, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: object }
                isVisible: { type: boolean }
                key: { type: string, nullable: true }
                sortOrder: { type: integer }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Section' } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: section, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
  /admin/blocks/{key}:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      summary: Alias kompatibilitas (history|vision-mission|contact)
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ data: { key, type, data, updatedAt } }' }
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { data: { type: object } } }
      responses:
        '200': { description: OK }
  /admin/menus/{location}:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: location, in: path, required: true, schema: { type: string, enum: [header, footer] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Menu' } } } } } }
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      summary: Ganti seluruh pohon (maks 2 tingkat)
      parameters: [{ name: location, in: path, required: true, schema: { type: string, enum: [header, footer] } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/MenuItemInput' } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/customer-logos:
    get:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: '{ data: CustomerLogo[] }' }
    post:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CustomerLogo' }
      responses:
        '201': { description: OK }
  /admin/customer-logos/{customerLogo}:
    put:
      tags: [admin-cms]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: customerLogo, in: path, required: true, schema: { type: integer } }]
      requestBody: { $ref: '#/components/requestBodies/CustomerLogo' }
      responses:
        '200': { description: OK }
    delete:
      tags: [admin-cms]
