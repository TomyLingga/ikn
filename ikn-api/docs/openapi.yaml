            to:
              type: string
              format: date-time
            orders:
              type: integer
            revenue:
              type: integer
            avgOrder:
              type: integer
            items:
              type: integer
            changePct:
              type: object
              properties:
                orders:
                  type: number
                  nullable: true
                revenue:
                  type: number
                  nullable: true
                avgOrder:
                  type: number
                  nullable: true
                items:
                  type: number
                  nullable: true
        trend:
