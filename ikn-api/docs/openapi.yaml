      description: 'Bagian yang bergantung pasar (ASUMSI A-86) mengikuti pengunjung: customer ekspor yang login mendapat `market = export`,

        `currency = USD`, `deliveryTerms` ekspor (FOB, CIF), `paymentTerms` ekspor, dan `fees` USD. Tamu, admin, dan customer lokal

