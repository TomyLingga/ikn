        '429':
          $ref: '#/components/responses/TooMany'
  /auth/verify-email/{id}/{hash}:
    get:
      tags:
      - auth
      summary: Tautan verifikasi dari email (URL bertanda tangan, berlaku 60 menit). Selalu redirect ke FE.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: hash
        in: path
        required: true
        schema:
          type: string
        description: sha1(email)
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect ke FRONTEND_URL/login?verified=1 (sukses/sudah terverifikasi) atau ?verified=0 (tautan tidak valid/kedaluwarsa)
