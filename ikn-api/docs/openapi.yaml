    put:
      tags:
      - admin-commerce-config
      summary: Ubah lokasi pabrik (penggantian penuh; kode boleh dikirim bila sama, kode lain → 422 code; lat/lng tidak dikirim = dikosongkan)
      security:
      - cookieAuth: []
      parameters:
      - name: factoryLocation
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
