      - cookieAuth: []
      summary: 'Terima penawaran ongkir admin (CIF, ASUMSI A-89, kontrak 11.12): awaiting_freight → pending_payment'
      description: 'Hanya penawaran admin putaran terakhir berstatus `proposed` yang belum lewat `validUntil`. Dalam satu transaksi (baris order
        FOR UPDATE):

        `quote.status = accepted`, `shippingTotal = total`, `shippingMethod { type quoted, amount, quoteId, round, lines[] }`, `grandTotal` dihitung
        ulang

        (subtotal − diskon + ongkir + fee + pajak bila eksklusif), payment pending dibuat dari `pendingPaymentMethod` (nonaktif → transfer manual
        aktif pertama + rekening aktif se-mata-uang; kode unik IDR dialokasikan di sini), `paymentDueAt = sekarang +

        exportPaymentDueHours` (USD) / `paymentDueHours`, transisi `awaiting_freight → pending_payment` (timeline.meta { quoteId, freightTotal,
        acceptedBy: customer }).

        Email customer `FreightAccepted` (rincian ongkir + instruksi bayar) + in-app `order.freight_accepted`; email admin.

