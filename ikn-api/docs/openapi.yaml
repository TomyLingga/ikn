        '409':
          description: 'FREIGHT_QUOTE_NOT_ALLOWED: order bukan awaiting_freight (meta.status)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'VALIDATION_ERROR: lines kosong/lebih dari 10/total 0, lines.N.label > 80, lines.N.amount bukan integer ≥ 0, validUntil
