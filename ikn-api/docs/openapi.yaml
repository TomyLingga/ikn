      description: 'Pabrik = titik asal ongkir per km (Franco: keranjang dipecah per pabrik asal item, lihat ShippingRateQuote.origins) dan

        titik ambil Loco (allowsPickup). Menggantikan /admin/shipping-origin dan /admin/pickup-location (dihapus). Faktor jalan

        tetap setting `shipping_road_factor`: /admin/shipping/road-factor (modul shipping) atau /admin/settings `shippingRoadFactor`.

        '
      security:
      - cookieAuth: []
