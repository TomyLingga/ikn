        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminFactoryLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin-commerce-config
      summary: Tambah lokasi pabrik (kode slug unik, dinormalkan lowercase; tidak bisa diubah setelahnya)
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryLocationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminFactoryLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
