  /geo/search:
    get:
      tags:
      - geo
      summary: Geocoding teks (Nominatim search, limit 5, cache 7 hari per scope). scope id (bawaan) = countrycodes=id untuk alamat customer;
        world = tanpa batas negara untuk pelabuhan tujuan CIF (ASUMSI A-89).
      security:
      - cookieAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 200
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - world
          default: id
      responses:
        '200':
          $ref: '#/components/responses/GeoResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          description: UPSTREAM_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /geo/reverse:
    get:
      tags:
      - geo
      summary: Reverse geocoding (Nominatim reverse, cache 30 hari). data berisi 0 atau 1 item.
      security:
      - cookieAuth: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      responses:
        '200':
          $ref: '#/components/responses/GeoResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
        '502':
          description: UPSTREAM_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
