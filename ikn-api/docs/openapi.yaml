    ShippingRate:
      type: object
      description: 'flat: amount = baseAmount. calculated (ASUMSI A-76): amount = max(minAmount, baseAmount + perKmAmount × ⌈km⌉ + perKgAmount
        × ⌈kg⌉ + perM3Amount × m³ (dibulatkan ke atas per 0,01 m³)); 0 bila subtotal − diskon ≥ freeAbove'
      properties:
        id:
          type: integer
        zoneId:
          type: integer
        zone:
          type: object
          properties:
            id:
              type: integer
            name:
              $ref: '#/components/schemas/I18n'
        name:
          $ref: '#/components/schemas/I18n'
        label:
          $ref: '#/components/schemas/I18n'
          description: sama dengan name (alias FE lama)
        type:
          type: string
          enum:
          - flat
          - calculated
        baseAmount:
          type: integer
        perKmAmount:
          type: integer
        perKgAmount:
          type: integer
        perM3Amount:
          type: integer
        minAmount:
          type: integer
        freeAbove:
          type: integer
          nullable: true
        eta:
          $ref: '#/components/schemas/I18n'
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
