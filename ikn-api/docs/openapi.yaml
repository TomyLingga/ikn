  /cart/quote:
    post:
      tags:
      - cart
      security:
      - cookieAuth: []
      summary: Validasi item dan hitung total tanpa membuat order (customer login; belum harus disetujui)
      description: 'Body sama dengan POST /customer/orders. Tanpa `addressId`: `shipping = null`, `availableShippingRates = []`.

        Dengan `addressId` (alamat milik user): `availableShippingRates[]` dihitung untuk berat keranjang dan

        `shipping` terisi bila `shippingRateId` termasuk daftar itu. `uniqueCode` bersifat sementara (1–999) bila

        metode `manual_transfer` dan setting `uniqueCodeEnabled`; nilai final ditetapkan saat checkout.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuoteResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: INSUFFICIENT_STOCK (meta.items[] { productSlug, requested, available }) atau VOUCHER_INVALID (meta.reason in not_found|inactive|expired|not_started|quota|per_user_limit|min_subtotal|scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'VALIDATION_ERROR: produk tidak ada/unpublished/price_mode=quote (items.N.productSlug), qty < moq (items.N.qty), shippingRateId
            tidak berlaku, paymentMethodCode tidak aktif, addressId bukan milik user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
