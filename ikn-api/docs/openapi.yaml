      - cookieAuth: []
      summary: Kurs USD/IDR JISDOR untuk keuangan (ASUMSI A-84); informasi saja, tidak dipakai order/invoice/laporan
      description: 'Rentang inklusif di zona aplikasi; bawaan 30 hari terakhir. `latest` = kurs hari kerja terakhir (tanggal <= hari ini),

        `average`/`max`/`min` dari baris dalam rentang (rupiah bulat), `staleDays` = hari kerja (Senin-Jumat) sejak `latest.date`,

        `stale` = lebih dari 3 hari kerja. Sumber `jisdor` diisi command `rates:fetch`, `manual` dari POST.

