          maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PageMeta'
                    - type: object
                      properties:
                        groups:
                          $ref: '#/components/schemas/OrderGroupCounts'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - orders
      security:
      - cookieAuth: []
      summary: Checkout (customer aktif) — reserve stok + voucher, payment pending, email
      description: 'Body sama dengan POST /cart/quote tetapi `addressId`, `shippingRateId`, `paymentMethodCode` wajib.

        Dalam satu transaksi: produk dikunci `SELECT ... FOR UPDATE` urut id, dihitung ulang OrderCalculator,

        kode unik final unik di antara order pending_payment hari ini (manual_transfer + setting), snapshot alamat/harga/ongkir.

        Header `Idempotency-Key` (opsional, ≤ 80 karakter, per user, 24 jam): kunci sama mengembalikan order yang sama dengan **200** (bukan 201).

        '
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Order baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '200':
          description: Order yang sama (Idempotency-Key sudah dipakai ≤ 24 jam)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          description: ACCOUNT_NOT_APPROVED (meta.status) bila customer belum disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: INSUFFICIENT_STOCK (meta.items[]) | VOUCHER_INVALID (meta.reason)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: GATEWAY_ERROR (metode gateway) | 503 GATEWAY_UNAVAILABLE (secret belum diisi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
