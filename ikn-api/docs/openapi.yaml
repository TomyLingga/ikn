          format: date-time
          nullable: true
          description: masa berlaku; YYYY-MM-DD = akhir hari itu (zona aplikasi); kosong = sekarang + setting freightQuoteValidDays; harus di
            masa depan
        note:
          type: string
          nullable: true
          maxLength: 1000
    FreightQuoteExtendInput:
      type: object
      required:
      - validUntil
      properties:
        validUntil:
          type: string
          format: date-time
          description: masa berlaku baru, di masa depan; YYYY-MM-DD = akhir hari itu
    FreightCounterInput:
      type: object
      description: POST /customer/orders/{number}/freight-quotes/counter
      required:
      - amount
      properties:
        amount:
          type: integer
          minimum: 1
          example: 70000
          description: harga balasan total ongkir, satuan terkecil mata uang order
        note:
          type: string
          nullable: true
          maxLength: 500
    FreightQuote:
      type: object
      description: Satu putaran penawaran ongkir CIF (ASUMSI A-89, kontrak 11.12). Uang satuan terkecil mata uang order
      properties:
        id:
          type: integer
        round:
          type: integer
          minimum: 1
        proposedBy:
          type: string
          enum:
          - admin
          - customer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FreightQuoteLine'
          description: 'balasan customer selalu satu baris { label: "Penawaran customer", amount }'
        total:
          type: integer
          description: jumlah semua baris
        note:
          type: string
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: null untuk balasan customer (tidak kedaluwarsa)
        status:
          type: string
          enum:
          - proposed
          - accepted
          - rejected
          - superseded
          - expired
          description: proposed = menunggu pihak lawan; rejected = order dibatalkan; superseded = diganti putaran berikutnya; expired = lewat
            validUntil
        expired:
          type: boolean
          description: status expired, atau proposed yang validUntil-nya sudah lewat sebelum scheduler menandainya (tidak bisa diterima)
        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
          description: saat accepted/rejected/superseded
    ProformaInput:
      type: object
      description: 'PUT /admin/orders/{number}/proforma: semua field opsional (string kosong = null); field yang tidak dikirim menjadi null karena
        PUT mengganti seluruh isi proforma'
      properties:
        vesselName:
          type: string
          nullable: true
          maxLength: 120
        voyage:
          type: string
          nullable: true
          maxLength: 60
        etd:
          type: string
          format: date
          nullable: true
        eta:
          type: string
          format: date
          nullable: true
        portOfLoading:
          type: string
          nullable: true
          maxLength: 120
          description: revisi 1 kosong = pelabuhan muat term (snapshot alamat loadingPort, lalu baris delivery_terms)
        portOfDischarge:
          type: string
          nullable: true
          maxLength: 120
          description: revisi 1 kosong = nama pelabuhan tujuan order bila kolomnya ada (Phase E5)
        paymentTerms:
          type: string
          nullable: true
          maxLength: 1000
          description: revisi 1 kosong = keterangan/nama EN syarat pembayaran order
        notes:
          type: string
          nullable: true
          maxLength: 2000
        validUntil:
          type: string
          format: date
          nullable: true
    Proforma:
      type: object
      description: 'Data proforma invoice per order (ASUMSI A-88): nomor PI/{order} tetap, label menambah " Rev.N" untuk revisi > 1; cetakan dirender
        FE dari Order'
      properties:
        number:
          type: string
          example: PI/IKN-20261103-00001
        label:
          type: string
          example: PI/IKN-20261103-00001 Rev.2
        revision:
          type: integer
          minimum: 1
        vesselName:
          type: string
          nullable: true
        voyage:
          type: string
          nullable: true
        etd:
          type: string
          format: date
          nullable: true
        eta:
          type: string
          format: date
          nullable: true
        portOfLoading:
          type: string
          nullable: true
        portOfDischarge:
          type: string
          nullable: true
        paymentTerms:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true
        issuedAt:
          type: string
          format: date-time
          description: saat revisi 1 dibuat; tidak berubah saat revisi
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
    Order:
      type: object
      description: Bentuk Order lengkap (kontrak bagian 9, superset tipe FE). Uang integer satuan terkecil `currency` (IDR rupiah bulat, USD sen;
        ASUMSI A-86), tanggal ISO-8601 +07:00.
      properties:
        id:
          type: integer
        number:
          type: string
          example: IKN-20260921-00043
        invoiceNumber:
          type: string
          nullable: true
          example: INV/2026/09/00021
        date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        locale:
          type: string
          enum:
          - id
          - en
        currency:
          type: string
          enum:
          - IDR
          - USD
          description: mata uang semua angka uang di order ini; USD hanya customer ekspor
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: integer
        discountTotal:
          type: integer
        shippingTotal:
          type: integer
        feeTotal:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                $ref: '#/components/schemas/I18n'
              type:
                type: string
              amount:
                type: integer
        taxTotal:
          type: integer
        taxRate:
          type: number
        priceIncludesTax:
          type: boolean
        uniqueCode:
          type: integer
          description: 0 bila tanpa kode unik (selalu 0 untuk USD)
        grandTotal:
          type: integer
        voucherCode:
          type: string
          nullable: true
          description: selalu null untuk USD
        shippingMethod:
          type: object
          nullable: true
          description: 'snapshot ongkir; type pickup|included = baris sintetis term tanpa ongkir (rateId/zoneId null, amount 0); type quoted =
            CIF (ASUMSI A-89): amount 0 selama awaiting_freight, lalu total penawaran yang disepakati + lines[] + quoteId'
          properties:
            rateId:
              type: integer
              nullable: true
            zoneId:
              type: integer
              nullable: true
            label:
              $ref: '#/components/schemas/I18n'
            eta:
              $ref: '#/components/schemas/I18n'
              nullable: true
            amount:
              type: integer
            type:
              type: string
              enum:
              - flat
              - calculated
              - per_kg
              - pickup
              - included
              - quoted
            weightGram:
              type: integer
            volumeCm3:
              type: integer
            distanceKm:
              type: integer
              nullable: true
            breakdown:
              $ref: '#/components/schemas/ShippingBreakdown'
              nullable: true
            origins:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/ShippingOrigin'
              description: 'tarif zona: rincian per pabrik asal (ASUMSI A-90); null untuk order sebelum A-90 dan term tanpa tarif zona'
            lines:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/FreightQuoteLine'
              description: rincian ongkir CIF yang disepakati (Ocean freight, Port charges, Insurance, ...); null sebelum disepakati / term lain.
                FE mencetak baris Freight/Insurance commercial invoice dari sini
            quoteId:
              type: integer
              nullable: true
        shippingAddress:
          type: object
          description: 'Term diantar: CustomerAddress::toSnapshot(): label, recipientName, phone, addressLine, provinceCode…villageCode, region{province,regency,district,village},
            postalCode, lat, lng, note. Term Loco: { type: pickup, points: PickupPoint[] (ASUMSI A-90; tidak ada di order lama), label, address,
            lat, lng (= titik pertama), recipientName (perusahaan/nama customer), phone }. Term FOB/CIF (ASUMSI A-86): { type: port, label{id,en}
            (nama term), loadingPort, destinationPort (CIF, A-89) | null, companyName, companyAddress, countryCode, recipientName, phone }. Tidak
            pernah [] ({ type: none } bila tanpa alamat).'
        destinationPort:
          allOf:
          - $ref: '#/components/schemas/DestinationPort'
          nullable: true
          description: pelabuhan tujuan CIF yang dipilih customer saat checkout (ASUMSI A-89); null untuk term lain
        pendingPaymentMethod:
          type: object
          nullable: true
          description: metode + rekening yang dibekukan saat checkout CIF dan dipakai membuat payment saat penawaran disepakati; null untuk order
            lain
          properties:
            code:
              type: string
              example: manual_transfer
            bankAccountId:
              type: integer
              nullable: true
        freightQuotes:
          type: array
          items:
            $ref: '#/components/schemas/FreightQuote'
          description: semua putaran penawaran ongkir CIF, terbaru dulu (kosong untuk term lain)
        activeFreightQuote:
          allOf:
          - $ref: '#/components/schemas/FreightQuote'
          nullable: true
          description: putaran terakhir bila masih proposed (admin atau balasan customer), termasuk yang expired = true belum ditandai scheduler;
            null bila tidak ada
        canAcceptFreightQuote:
          type: boolean
          description: 'customer: order awaiting_freight + penawaran admin terakhir proposed dan belum lewat validUntil'
        canCounterFreightQuote:
          type: boolean
          description: 'customer: syarat sama dengan canAcceptFreightQuote'
        canQuoteFreight:
          type: boolean
          description: 'admin: order awaiting_freight (boleh menawar baru / menerima balasan customer)'
        deliveryTerm:
          type: object
          nullable: true
          description: 'cara serah terima order (ASUMSI A-85): code dari kolom orders.delivery_term, family/pricingMode dari snapshot, name/loadingPort
            dari baris delivery_terms bila masih ada; null untuk order lama'
          properties:
            code:
              type: string
              example: loco
            name:
              $ref: '#/components/schemas/I18n'
              nullable: true
            family:
              type: string
              enum:
              - pickup
              - door
              - port
              nullable: true
            pricingMode:
              type: string
              enum:
              - none
              - zone
              - included
              - quoted
              nullable: true
            loadingPort:
              type: string
              nullable: true
        paymentTerm:
          type: object
          nullable: true
          description: syarat pembayaran yang dibekukan saat checkout (ASUMSI A-87); null untuk order lokal tanpa syarat
          properties:
            code:
              type: string
              example: tt_advance
            name:
              $ref: '#/components/schemas/I18n'
              nullable: true
            description:
              $ref: '#/components/schemas/I18n'
              nullable: true
        pickup:
          type: object
          nullable: true
          description: titik ambil (pertama) yang dibekukan saat checkout (hanya order Loco)
          properties:
            label:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            lat:
              type: number
              nullable: true
            lng:
              type: number
              nullable: true
        pickupPoints:
          type: array
          items:
            $ref: '#/components/schemas/PickupPoint'
          description: semua titik ambil, satu per pabrik asal item (ASUMSI A-90); order lama = satu titik dari field datar (code/name null);
            [] untuk order bukan Loco
        courier:
          type: string
          nullable: true
        trackingNumber:
          type: string
          nullable: true
          description: resi kurir; untuk order FOB/CIF berisi nomor B/L setelah dimuat ke kapal
        isPort:
          type: boolean
          description: 'true untuk order term pelabuhan (FOB/CIF): shipped = dimuat ke kapal dengan vesselName + blNumber (ASUMSI A-88)'
        shipmentDetails:
          allOf:
          - $ref: '#/components/schemas/ShipmentDetails'
          nullable: true
          description: data kapal/B/L yang dicatat saat shipped on board; null untuk order darat/Loco atau sebelum dikirim
        note:
          type: string
          nullable: true
        cancelReason:
          type: string
          nullable: true
        paymentDueAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        expiredAt:
          type: string
          format: date-time
          nullable: true
        activePayment:
          allOf:
          - $ref: '#/components/schemas/Payment'
          nullable: true
          description: payment pending/awaiting_verification terbaru
        payment:
          allOf:
          - $ref: '#/components/schemas/Payment'
          nullable: true
          description: alias activePayment (contoh 201 kontrak bagian 9)
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTimelineEntry'
        trackingUpdates:
          type: array
          items:
            $ref: '#/components/schemas/TrackingUpdate'
        canAddTracking:
          type: boolean
          description: true hanya saat status shipped dan bukan order Loco
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/OrderAttachment'
        canAttach:
          type: boolean
          description: true untuk order yang sudah dibayar (paid … completed)
        proforma:
          allOf:
          - $ref: '#/components/schemas/Proforma'
          nullable: true
          description: proforma invoice yang bisa diedit admin (PUT /admin/orders/{number}/proforma, ASUMSI A-88); null sebelum pertama disimpan
        canEditProforma:
          type: boolean
          description: false hanya untuk order cancelled/expired; FE memutuskan kapan menampilkan proforma (order ekspor)
        canCancel:
          type: boolean
          description: true untuk awaiting_freight dan pending_payment
        canUploadProof:
          type: boolean
          description: false selama awaiting_freight (belum ada payment)
        canChangePayment:
          type: boolean
        canConfirmReceived:
          type: boolean
        canComplete:
          type: boolean
        canReview:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProofResponse:
      type: object
      properties:
        order:
          type: object
          properties:
            number:
              type: string
            status:
              $ref: '#/components/schemas/OrderStatus'
            paymentStatus:
              $ref: '#/components/schemas/PaymentStatus'
        payment:
          $ref: '#/components/schemas/Payment'
    ReviewInput:
      type: object
      required:
      - productSlug
      - rating
      properties:
        productSlug:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
          nullable: true
          maxLength: 255
          description: maks. 255 karakter; ditolak (422 reviews.N.body) bila mengandung kata kasar (config/profanity.php)
    OrderStatusInput:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - processing
          - shipped
          - delivered
          - completed
        note:
          type: string
          nullable: true
          maxLength: 1000
        courier:
          type: string
          nullable: true
          maxLength: 120
          description: wajib untuk shipped pada order darat (Franco); diabaikan untuk order Loco (siap diambil tanpa kurir) dan order FOB/CIF
        trackingNumber:
          type: string
          nullable: true
          maxLength: 120
          description: wajib untuk shipped pada order darat; diabaikan untuk Loco dan FOB/CIF (server mengisi Order.trackingNumber dengan nomor
            B/L)
        vesselName:
          type: string
          nullable: true
          maxLength: 120
          description: 'order FOB/CIF (Order.isPort = true): WAJIB untuk shipped (422 vesselName); diabaikan untuk order lain (ASUMSI A-88)'
        voyage:
          type: string
          nullable: true
          maxLength: 60
          description: 'order FOB/CIF: opsional'
        blNumber:
          type: string
          nullable: true
          maxLength: 60
          description: 'order FOB/CIF: WAJIB untuk shipped (422 blNumber); disalin ke Order.trackingNumber'
        blDate:
          type: string
          format: date
          nullable: true
          description: 'order FOB/CIF: opsional, tidak boleh di masa depan; Order.shippedAt mengikuti tanggal ini (jam saat ini), kosong = sekarang'
    WebhookResponse:
      type: object
      properties:
        received:
          type: boolean
          example: true
        result:
          type: string
          enum:
          - processed
          - duplicate
          - ignored
          - error
        event:
          type: string
        externalId:
          type: string
          nullable: true
        paymentId:
          type: integer
          nullable: true
    CustomerDashboard:
      type: object
      description: Kompatibel CustomerDashboardStats FE + recentOrders + account
      properties:
        currency:
          type: string
          enum:
          - IDR
          - USD
          description: mata uang pasar customer; transactionValue dan monthly hanya dari order bermata uang ini (ASUMSI A-86)
        totalOrders:
          type: integer
        awaitingPayment:
          type: integer
          description: pending_payment + payment_review
        inProgress:
          type: integer
          description: paid + processing + shipped + delivered
        completed:
          type: integer
        transactionValue:
          type: integer
          description: Σ grandTotal order paid_at ≠ null, status ≥ paid
        range:
          type: object
          properties:
            from:
              type: string
              format: date
              nullable: true
            to:
              type: string
              format: date
              nullable: true
        toReview:
          type: integer
          description: order selesai yang masih punya produk belum diulas (sepanjang waktu)
        actionOrders:
          type: array
          description: maks. 6 order yang masih terbuka (sepanjang waktu)
          items:
            $ref: '#/components/schemas/OrderSummary'
        recentOrders:
          type: array
          description: 5 order terakhir pada rentang tanggal
          items:
            $ref: '#/components/schemas/OrderSummary'
        monthly:
          type: array
          description: belanja 6 bulan terakhir (paid_at)
          items:
            $ref: '#/components/schemas/SalesChartPoint'
        account:
          type: object
          properties:
            status:
              type: string
            rejectionReason:
              type: string
              nullable: true
            canOrder:
              type: boolean
    SalesChartPoint:
      type: object
      properties:
        ym:
          type: string
          example: 2026-09
        month:
          type: string
          example: Sep
          description: nama bulan singkat (ID)
        monthIndex:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        total:
          type: integer
          description: total grandTotal (rupiah) dari paid_at
        orders:
          type: integer
    AdminDashboard:
      type: object
      description: Semua angka uang (stats, kpis, salesChart, topProducts, paymentDue) hanya dari order IDR (ASUMSI A-86); order USD dirangkum
        terpisah di exportKpis (Phase E6). recentOrders/needsAction memuat semua mata uang dengan currency per baris.
      properties:
        currency:
          type: string
          enum:
          - IDR
        exportKpis:
          allOf:
          - $ref: '#/components/schemas/ExportKpis'
          nullable: true
          description: Additive (Phase E6). Blok ekspor USD; null bila belum pernah ada order USD.
        today:
          type: object
          description: Additive 2026-11-04. Hari ini s.d. sekarang vs kemarin s.d. jam yang sama; uang & order dibayar IDR, order dibuat semua
            mata uang.
          properties:
            revenue:
              type: integer
            paidOrders:
              type: integer
            ordersCreated:
              type: integer
            yesterdayRevenue:
              type: integer
            yesterdayPaidOrders:
              type: integer
            yesterdayOrdersCreated:
              type: integer
        trend30:
          type: array
          description: Additive 2026-11-04. Pendapatan IDR per hari, 30 hari terakhir (hari kosong = 0).
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              total:
                type: integer
              orders:
                type: integer
        statusBreakdown:
          type: array
          description: Additive 2026-11-04. Order dibuat bulan ini per status saat ini (semua mata uang), hanya status yang ada.
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
        topCustomers:
          type: array
          items:
            type: object
            properties:
              userId:
                type: integer
                nullable: true
              name:
                type: string
              company:
                type: string
              orders:
                type: integer
              revenue:
                type: integer
              lastPaidAt:
                type: string
                format: date-time
                nullable: true
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryId:
                type: integer
                nullable: true
              name:
                $ref: '#/components/schemas/I18n'
              qty:
                type: integer
              orders:
                type: integer
              revenue:
                type: integer
        stats:
          type: object
          properties:
            ordersToday:
              type: integer
            ordersThisMonth:
              type: integer
            awaitingVerification:
              type: integer
              description: payment awaiting_verification
            pendingVerification:
              type: integer
              description: alias awaitingVerification (FE mock)
            revenueThisMonth:
              type: integer
            pendingCustomers:
              type: integer
            activeCustomers:
              type: integer
        recentOrders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
          description: 10 terbaru
        needsAction:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
          description: payment_review, paid, processing (maks 10)
        salesChart:
          type: array
          items:
            $ref: '#/components/schemas/SalesChartPoint'
          description: 12 bulan tahun dipilih
        salesByMonth:
          type: array
          items:
            $ref: '#/components/schemas/SalesChartPoint'
          description: alias salesChart (FE mock)
        year:
          type: integer
        period:
          type: object
          description: 'Additive (dashboard v2). Periode KPI: awal bulan s.d. sekarang vs rentang yang sama di bulan lalu.'
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            previousFrom:
              type: string
              format: date-time
            previousTo:
              type: string
              format: date-time
        kpis:
          type: object
          description: Additive. Pendapatan & order dari paid_at (status PAID_STATUSES), customer baru dari created_at.
          properties:
            revenue:
              $ref: '#/components/schemas/DashboardMetric'
            paidOrders:
              $ref: '#/components/schemas/DashboardMetric'
            avgOrderValue:
              $ref: '#/components/schemas/DashboardMetric'
            newCustomers:
              $ref: '#/components/schemas/DashboardMetric'
        workQueue:
          type: object
          description: Additive. Antrean kerja; null = admin tidak punya modulnya (aturan sama dengan /admin/badges).
          properties:
            paymentsToVerify:
              type: integer
              nullable: true
              description: payment awaiting_verification (modul payments)
            freightToQuote:
              type: integer
              nullable: true
              description: 'order awaiting_freight tanpa penawaran admin proposed yang masih berlaku: order CIF baru, balasan customer, atau penawaran
                kedaluwarsa (modul orders, ASUMSI A-89)'
            ordersToProcess:
              type: integer
              nullable: true
              description: order paid (modul orders)
            ordersToShip:
              type: integer
              nullable: true
              description: order processing (modul orders)
            ordersInTransit:
              type: integer
              nullable: true
              description: order shipped (modul orders)
            ordersDelivered:
              type: integer
              nullable: true
              description: order delivered, menunggu selesai (modul orders)
            paymentsOverdue:
              type: integer
              nullable: true
              description: order pending_payment lewat payment_due_at (modul orders)
            customersToApprove:
              type: integer
              nullable: true
              description: customer pending (modul customers)
            unreadChats:
              type: integer
              nullable: true
              description: percakapan dengan pesan belum dibaca admin (modul chat)
        topProducts:
          type: array
          description: Additive. Maks 5 produk terlaris bulan ini menurut pendapatan (paid_at); nama dari snapshot order terakhir.
          items:
            type: object
            properties:
              productId:
                type: integer
              productSlug:
                type: string
                nullable: true
              code:
                type: string
                nullable: true
              name:
                $ref: '#/components/schemas/I18n'
              image:
                type: string
                nullable: true
              unit:
                type: string
                nullable: true
              qty:
                type: integer
              orders:
                type: integer
              revenue:
                type: integer
                description: rupiah, line_total - discount_amount
        lowStock:
          type: object
          description: Additive. Produk harga tetap (bukan made_to_order) dengan available < max(moq x rule.moqFactor, rule.min). Hanya baca.
          properties:
            total:
              type: integer
            rule:
              type: object
              properties:
                min:
                  type: integer
                  example: 50
                moqFactor:
                  type: integer
                  example: 10
            items:
              type: array
              description: maks 6, available terkecil dulu
              items:
                type: object
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  code:
                    type: string
                    nullable: true
                  name:
                    $ref: '#/components/schemas/I18n'
                  image:
                    type: string
                    nullable: true
                  unit:
                    type: string
                    nullable: true
                  moq:
                    type: integer
                  stock:
                    type: integer
                  reserved:
                    type: integer
                  available:
                    type: integer
                  threshold:
                    type: integer
                  stockStatus:
                    type: string
                    enum:
                    - in_stock
                    - made_to_order
                    - out_of_stock
                  isPublished:
                    type: boolean
        paymentDue:
          type: object
          description: Additive. Order pending_payment yang lewat atau mendekati payment_due_at (windowHours ke depan).
          properties:
            overdue:
              type: integer
            dueSoon:
              type: integer
            windowHours:
              type: integer
              example: 48
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderSummary'
              description: maks 6, payment_due_at terdekat dulu
    DashboardMetric:
      type: object
