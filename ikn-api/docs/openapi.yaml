openapi: 3.0.3
info:
  title: IKN API
  version: 1.0.0
  description: 'API PT Industri Karet Nusantara (Laravel 8.83.29). Envelope sukses `{ data }` (+ `meta` untuk paginasi),

    envelope error `{ message, code, errors?, meta? }`. Field translatable berbentuk `{ id, en }`.

    Auth admin memakai Sanctum cookie SPA: `GET /sanctum/csrf-cookie` lalu `POST /api/v1/auth/admin/login`

    dengan `credentials: include` dan header `X-XSRF-TOKEN`. Ringkasan manusia: plan/02-api-contract.md.

    '
servers:
- url: http://localhost:8000/api/v1
  description: Dev lokal
tags:
- name: auth
- name: content
- name: forms
- name: files
- name: admin-users
- name: admin-media
- name: admin-settings
- name: admin-cms
- name: admin-content
- name: admin-wbs
- name: admin-messages
- name: customer
  description: Profil dan alamat customer (auth:sanctum + role customer)
- name: regions
  description: Wilayah Kemendagri 4 level (publik)
- name: geo
  description: Proxy geocoding Nominatim (auth:sanctum, 60/menit per IP, upstream 1/detik)
- name: admin-customers
  description: Admin customers (modul customers)
- name: countries
  description: Daftar negara ISO 3166-1 alpha-2 (publik)
- name: catalog
  description: Katalog publik (kategori, produk, ulasan) dan konfigurasi commerce publik
- name: cart
  description: Quote keranjang (validasi item + hitung total tanpa membuat order)
- name: admin-catalog
  description: Admin kategori, produk, gambar, ulasan, stok
- name: admin-commerce-config
  description: Admin rekening bank, fee, zona/tarif ongkir, cara serah terima + titik ambil Loco, voucher, metode bayar, settings commerce
- name: orders
  description: Order customer (checkout, detail, cancel, konfirmasi, ulasan, dashboard)
- name: payments
  description: Pembayaran customer (histori percobaan bayar, ganti metode, unggah bukti)
- name: webhook
  description: Webhook gateway pembayaran (publik, verifikasi token per provider)
- name: admin-orders
  description: Admin order (modul orders)
- name: admin-payments
  description: Admin verifikasi pembayaran (modul payments)
- name: admin-dashboard
  description: Dashboard admin (modul dashboard)
- name: admin-reports
  description: Laporan penjualan dan kurs JISDOR (modul reports)
- name: admin-audit
  description: Audit log (super_admin)
- name: notifications
  description: Notifikasi dalam aplikasi untuk customer (lonceng portal) dan penghitung badge
- name: chat
  description: Live chat customer dengan penjual (polling, tanpa websocket)
- name: admin-chat
  description: Kotak masuk live chat admin (modul chat)
paths:
  /ping:
    get:
      summary: Health check API
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      time:
                        type: string
                        format: date-time
                        example: '2026-09-22T09:24:00+07:00'
                      locale:
                        type: string
                        enum:
                        - id
                        - en
  /auth/login:
    post:
      tags:
      - auth
      summary: Login customer (sesi cookie). Registrasi/verifikasi email menyusul di phase akun.
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200':
          $ref: '#/components/responses/UserSession'
        '403':
          description: EMAIL_NOT_VERIFIED atau ACCOUNT_NOT_APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/admin/login:
    post:
      tags:
      - auth
      summary: Login admin / super_admin (rate limit 5/menit per IP+email)
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200':
          $ref: '#/components/responses/UserSession'
        '400':
          description: BAD_REQUEST bila request bukan dari origin FE stateful
        '403':
          description: FORBIDDEN bila akun tidak aktif
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/logout:
    post:
      tags:
      - auth
      security:
      - cookieAuth: []
      summary: Hapus sesi
      responses:
        '200':
          description: '{ data: { ok: true }, message }'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags:
      - auth
      security:
      - cookieAuth: []
      summary: User sesi saat ini (admin menyertakan permissions + modules)
      responses:
        '200':
          $ref: '#/components/responses/UserSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /upload-limits:
    get:
      tags:
      - content
      summary: Batas ukuran unggahan efektif (KB) = config ikn dibatasi upload_max_filesize/post_max_size PHP; FE menolak berkas terlalu besar
        sebelum mengirim
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imageKb:
                        type: integer
                      documentKb:
                        type: integer
                      videoKb:
                        type: integer
                      proofKb:
                        type: integer
                      attachmentKb:
                        type: integer
                      wbsKb:
                        type: integer
                      serverKb:
                        type: integer
                        description: batas PHP server (0 = tidak terbatas)
  /content/site:
    get:
      tags:
      - content
      summary: Bundel lintas halaman untuk navbar/footer (settings publik, menu header+footer, blok kontak, doc-links aktif)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings:
                        $ref: '#/components/schemas/SiteSettings'
                      menus:
                        type: object
                        properties:
                          header:
                            $ref: '#/components/schemas/Menu'
                          footer:
                            $ref: '#/components/schemas/Menu'
                      contact:
                        $ref: '#/components/schemas/ContactInfo'
                        nullable: true
                      docLinks:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocLink'
  /content/settings:
    get:
      tags:
      - content
      summary: Setting publik (bersarang per grup)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SiteSettings'
  /content/menus/{location}:
    get:
      tags:
      - content
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          enum:
          - header
          - footer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Menu'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/doc-links:
    get:
      tags:
      - content
      parameters:
      - name: category
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Daftar doc-link aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocLink'
  /content/pages/{slug}:
    get:
      tags:
      - content
      summary: Halaman published dengan section yang tampil (media terhidrasi)
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/blocks/{key}:
    get:
      tags:
      - content
      summary: Alias kompatibilitas ke section tertentu (history, vision-mission, contact)
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum:
          - history
          - vision-mission
          - contact
      responses:
        '200':
          description: '{ data: { key, type, data: content, updatedAt } }'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/news:
    get:
      tags:
      - content
      parameters:
      - name: category
        in: query
        schema:
          type: string
        description: slug kategori (lihat /content/news-categories)
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Berita terbit tanpa body
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
  /content/news-categories:
    get:
      tags:
      - content
      summary: Kategori berita + jumlah berita terbit (filter di halaman Berita)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostCategory'
  /content/news/{slug}:
    get:
      tags:
      - content
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detail + related (maks 3, kategori sama diprioritaskan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
  /content/gallery:
    get:
      tags:
      - content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GalleryItem'
  /content/certificates:
    get:
      tags:
      - content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certificate'
  /content/brochures:
    get:
      tags:
      - content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brochure'
  /content/customer-logos:
    get:
      tags:
      - content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerLogo'
  /wbs:
    post:
      tags:
      - forms
      summary: Kirim laporan WBS (rate limit 5/jam per IP). Lampiran ke disk private.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - subject
              - body
              properties:
                subject:
                  type: string
                  maxLength: 200
                body:
                  type: string
                  maxLength: 5000
                isAnonymous:
                  type: boolean
                  default: true
                reporterName:
                  type: string
                reporterContact:
                  type: string
                  description: wajib bila isAnonymous=false
                attachment:
                  type: string
                  format: binary
                  description: pdf/jpg/png ≤ 10 MB
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
                isAnonymous:
                  type: boolean
                reporterName:
                  type: string
                reporterContact:
                  type: string
      responses:
        '201':
          description: '{ data: { code: "WBS-202609-0001", status: "new", createdAt }, message }'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
  /wbs/{code}:
    get:
      tags:
      - forms
      summary: Status laporan by kode (tanpa isi)
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ data: { code, status, createdAt, updatedAt } }'
        '404':
          $ref: '#/components/responses/NotFound'
  /contact:
    post:
      tags:
      - forms
      summary: Kirim pesan kontak (rate limit 5/jam per IP)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - message
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                subject:
                  type: string
                message:
                  type: string
                type:
                  type: string
                  enum:
                  - contact
                  - quote
                  default: contact
                productSlug:
                  type: string
      responses:
        '201':
          description: '{ data: { id, receivedAt }, message }'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooMany'
  /files/{media}:
    get:
      tags:
      - files
      security:
      - cookieAuth: []
      summary: Unduh berkas privat (MediaPolicy - admin aktif, atau customer pemilik order untuk bukti bayarnya)
      description: 'Bisa dibuka langsung di tab browser oleh pengguna yang sudah login: middleware `session.downloads` menyalakan sesi walau permintaan
        tidak membawa Origin/Referer FE (tautan rel=noreferrer, alamat ditempel, muat ulang).'
      parameters:
      - name: media
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Isi berkas
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/permissions/self:
    get:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      summary: Modul yang boleh diakses admin saat ini
      responses:
        '200':
          description: '{ data: { role, modules: string[] } }'
  /admin/users:
    get:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      summary: Daftar akun admin (super_admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
    post:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/users/modules:
    get:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      summary: Daftar modul untuk form hak akses
      responses:
        '200':
          description: '{ data: [ { code, name: {id,en} } ] }'
  /admin/users/{user}:
    put:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      parameters:
      - name: user
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '422':
          description: Termasuk cannot_deactivate_self pada field active
  /admin/help-guide:
    get:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      responses:
        '200':
          description: '{ data: { title, type: url|file, url, file: Media|null } }'
    post:
      tags:
      - admin-users
      security:
      - cookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - title
              - type
              properties:
                title:
                  type: string
                type:
                  type: string
                  enum:
                  - url
                  - file
                url:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Sama seperti GET
  /admin/media:
    get:
      tags:
      - admin-media
      security:
      - cookieAuth: []
      parameters:
      - name: collection
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - image
          - video
          - visual
          - document
        description: visual = gambar + video; document = selain keduanya
      - name: q
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
      - name: perPage
        in: query
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: '{ data: Media[], meta }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags:
      - admin-media
      security:
      - cookieAuth: []
      summary: Unggah ke disk public (gambar ≤ 5 MB, dokumen hanya PDF ≤ 10 MB, video mp4/webm ≤ 100 MB; mime dideteksi finfo)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                collection:
                  type: string
                  default: general
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '413':
          description: FILE_TOO_LARGE
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
  /admin/media/url:
    post:
      tags:
      - admin-media
      security:
      - cookieAuth: []
      summary: Tautkan foto/video dari URL tanpa mengunggah (A-92)
      description: YouTube (watch, youtu.be, shorts, embed), Vimeo, Google Drive (berkas dibagikan publik; bawaan gambar, kind=video untuk video),
        atau URL langsung berkas gambar/video (jenis dari ekstensi; tanpa ekstensi wajib kind). Disimpan sebagai media disk external berukuran
        0, tidak ada berkas di server. URL tidak dikenali / jenis tidak cocok → 422 pada url.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  maxLength: 2048
                  example: https://youtu.be/FGJQW6l2hrk
                kind:
                  type: string
                  enum:
                  - auto
                  - image
                  - video
                  default: auto
                name:
                  type: string
                  maxLength: 120
                  description: nama tampilan; kosong = dari URL
                collection:
                  type: string
                  default: general
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '422':
          description: VALIDATION_ERROR (url)
  /admin/media/{media}:
    delete:
      tags:
      - admin-media
      security:
      - cookieAuth: []
      parameters:
      - name: media
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '409':
          description: MEDIA_IN_USE
  /admin/site-settings:
    get:
      tags:
      - admin-settings
      security:
      - cookieAuth: []
      summary: Semua setting situs (termasuk privat). Catatan — /admin/settings dicadangkan untuk pengaturan commerce.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SiteSettings'
    put:
      tags:
      - admin-settings
      security:
      - cookieAuth: []
      summary: Perbarui sebagian (bersarang); kunci di luar skema diabaikan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSettings'
      responses:
        '200':
          description: '{ data, message }'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/site-settings/mail-test:
    post:
      tags:
      - admin-settings
      security:
      - cookieAuth: []
      summary: Kirim email uji (sinkron) memakai `mail` dari form (belum disimpan) atau pengaturan tersimpan bila `mail` tidak dikirim. Tidak
        menyimpan apa pun.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              properties:
                to:
                  type: string
                  format: email
                mail:
                  $ref: '#/components/schemas/SiteSettings/properties/mail'
      responses:
        '200':
          description: '{ data: MailTestResult, message }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MailTestResult'
                  message:
                    type: string
        '422':
          description: ValidationError (to / mail.*), MAIL_TEST_FAILED (alasan dari server SMTP di message), MAIL_DISABLED (mode off)
  /admin/cms/section-types:
    get:
      tags:
      - admin-cms
      security:
      - cookieAuth: []
      summary: Skema tipe section untuk form admin otomatis
      responses:
        '200':
          description: '{ data: { types: { [type]: SectionTypeDef }, groups: { [group]: I18n }, icons: string[] } }. SectionTypeDef = { name,
            description, pages[] (petunjuk halaman bawaan, bukan pembatas), group (kunci di groups: header|content|showcase|data|contact), fields
            }. Tipe: page_header, hero, marquee, stats, capabilities, product_highlights, video_gallery, cta, text_visual, timeline, vision_mission,
            values, org_chart, contact_info, contact_form, contact_summary, link_cards, pillars, info_blocks, wbs_form, customer_logos, certificates,
            brochures, gallery, news, latest_news, steps, icon_features, faq, spec_table, team, testimonials, image_grid, rich_text.'
  /admin/pages:
    get:
      tags:
      - admin-cms
      security:
      - cookieAuth: []
      responses:
        '200':
          description: '{ data: [ { id, slug, title, status, template, sectionCount, isProtected, updatedAt } ] }'
    post:
      tags:
      - admin-cms
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
  /admin/pages/{page}:
    get:
      tags:
