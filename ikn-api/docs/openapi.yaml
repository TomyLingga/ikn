          description: id wajib, en diisi dari id bila kosong
        description:
          $ref: '#/components/schemas/I18n'
          nullable: true
        family:
          type: string
          enum:
          - pickup
          - door
          - port
        market:
          type: string
          enum:
          - local
          - export
        pricingMode:
          type: string
          enum:
          - none
          - zone
          - included
          - quoted
        taxProfile:
          type: string
          enum:
          - domestic
          - export
