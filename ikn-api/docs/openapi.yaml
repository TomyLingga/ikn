    post:
      tags:
      - orders
      security:
      - cookieAuth: []
      summary: Checkout (customer aktif) — reserve stok + voucher, payment pending, email
      description: 'Body sama dengan POST /cart/quote tetapi `paymentMethodCode` wajib. `deliveryTermCode` (ASUMSI A-85) kosong = term aktif

        pertama pasar lokal; `addressId` + `shippingRateId` wajib hanya bila term memakai tarif zona (Franco). Term Loco: tanpa

        alamat dan ongkir, `shippingAddress` berisi titik ambil (`type: pickup`, `points[]` per pabrik asal, ASUMSI A-90), `shippingMethod.type
        = pickup`,

        `pickup` (titik pertama) dan `pickupPoints[]` terisi; item dari pabrik yang tidak melayani ambil → 422 `deliveryTermCode`.

        Dalam satu transaksi: produk dikunci `SELECT ... FOR UPDATE` urut id, dihitung ulang OrderCalculator,

        kode unik final unik di antara order pending_payment hari ini (manual_transfer + setting), snapshot alamat/harga/ongkir/term.

        Header `Idempotency-Key` (opsional, ≤ 80 karakter, per user, 24 jam): kunci sama mengembalikan order yang sama dengan **200** (bukan 201).

        Customer ekspor (ASUMSI A-86, A-87): order dalam USD (sen), term pasar ekspor (FOB `included`: tanpa alamat/ongkir, `shippingAddress`

        bertipe `port`), `paymentTermCode` WAJIB (aktif, pasar ekspor) dan dibekukan ke `paymentTerm`, pajak dari `exportTaxRate`, tanpa kode

        unik dan voucher, hanya `manual_transfer` ke rekening ber-`currency` USD, batas bayar `exportPaymentDueHours`.

        Term CIF (`pricingMode quoted`, ASUMSI A-89, kontrak 11.12): `destinationPort` WAJIB; order dibuat `awaiting_freight` dengan `shippingTotal`
        0,

        `grandTotal` sementara, `uniqueCode` 0, `paymentDueAt` null, tanpa `payment`; metode + rekening dibekukan ke `pendingPaymentMethod` dan
        payment

        dibuat saat penawaran ongkir disepakati. Stok direserve seperti biasa. Email + in-app `order.freight_requested`, email admin modul orders.

        '
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Order baru
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '200':
          description: Order yang sama (Idempotency-Key sudah dipakai ≤ 24 jam)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          description: ACCOUNT_NOT_APPROVED (meta.status) bila customer belum disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: INSUFFICIENT_STOCK (meta.items[]) | VOUCHER_INVALID (meta.reason)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'VALIDATION_ERROR: seperti /cart/quote; addressId/shippingRateId kosong untuk term zona; deliveryTermCode nonaktif, beda
            pasar, tidak ada, atau pricingMode quoted; paymentTermCode kosong (customer ekspor)/tidak ada/nonaktif/beda pasar; paymentMethodCode
            bukan manual_transfer untuk order USD; bankAccountId beda mata uang atau tidak ada rekening aktif se-mata-uang'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GATEWAY_ERROR (metode gateway) | 503 GATEWAY_UNAVAILABLE (secret belum diisi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
