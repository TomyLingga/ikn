          type: integer
    CommerceSettings:
      type: object
      description: Disimpan di tabel settings grup commerce (key commerce.<snake_case>, is_public=false); default config ikn.commerce.defaults
      properties:
        paymentDueHours:
          type: integer
          minimum: 1
          maximum: 720
          example: 24
        uniqueCodeEnabled:
          type: boolean
          example: true
        taxRate:
          type: number
          minimum: 0
          maximum: 100
          example: 11
        priceIncludesTax:
          type: boolean
          example: true
        autoCompleteDays:
          type: integer
          minimum: 0
          maximum: 90
          example: 7
        reminderHoursBeforeDue:
          type: integer
          minimum: 0
          maximum: 168
          example: 2
        invoicePrefix:
          type: string
          maxLength: 40
          example: PMS/X/INV/RA
          description: nomor invoice = {prefix}/{urut per bulan}/{bulan Romawi}/{tahun}; huruf, angka, titik, strip, garis miring
        invoiceSignerName:
          type: string
          maxLength: 120
          example: Amalia Nasution
        invoiceSignerTitle:
          type: string
          maxLength: 120
          example: SEVP Operation
        invoiceCc:
          type: string
          maxLength: 120
          example: ATU, File
          description: tembusan, dipisah koma
        shippingRoadFactor:
          type: number
          minimum: 1
          maximum: 3
          description: jarak jalan ≈ garis lurus × faktor (A-76). Titik asal ongkir dan titik ambil Loco = /admin/factory-locations (A-90); kunci
            lama shippingOrigin*/pickup* dihapus
        exportTaxRate:
          type: number
          minimum: 0
          maximum: 100
          example: 0
          description: pajak term ber-taxProfile export (FOB/CIF), ASUMSI A-86
        exportPaymentDueHours:
          type: integer
          minimum: 1
          maximum: 720
          example: 120
          description: batas bayar order USD (jam)
        freightQuoteValidDays:
          type: integer
          minimum: 1
          maximum: 90
          example: 7
          description: masa berlaku bawaan penawaran ongkir CIF bila admin tidak mengisi validUntil (hari), ASUMSI A-89
        freightQuoteMaxDays:
          type: integer
          minimum: 1
          maximum: 365
          example: 30
          description: batas tunggu order awaiting_freight tanpa penawaran yang masih berlaku sebelum dibatalkan otomatis oleh orders:freight-expire
            (hari)
    OrderStatus:
      type: string
      description: awaiting_freight = order CIF menunggu penawaran ongkir disepakati (ASUMSI A-89, kontrak 11.12); belum ada payment maupun batas
        bayar
      enum:
      - awaiting_freight
      - pending_payment
      - payment_review
      - paid
      - processing
      - shipped
      - delivered
      - completed
      - cancelled
      - expired
    PaymentStatus:
      type: string
      enum:
      - pending
      - awaiting_verification
      - paid
      - rejected
      - expired
      - failed
      - cancelled
