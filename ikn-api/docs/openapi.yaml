              - body
              properties:
                body:
                  type: string
                  maxLength: 2000
                context:
                  type: object
                  nullable: true
                  description: 'rujukan opsional: { type: product, slug } atau { type: order, number } (order harus milik sendiri); disimpan sebagai
                    snapshot'
                  properties:
                    type:
                      type: string
                      enum:
                      - product
                      - order
                    slug:
                      type: string
                    number:
                      type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/CustomerChatConversation'
                      message:
                        $ref: '#/components/schemas/ChatMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Terlalu banyak pesan
  /customer/chat/read:
    post:
      tags:
      - chat
      security:
      - cookieAuth: []
      summary: Tandai pesan admin sudah dibaca
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread:
                        type: integer
  /customer/chat/claim:
    post:
      tags:
      - chat
      security:
      - cookieAuth: []
      summary: Tamu yang baru login mengambil alih percakapan tamunya (token dari browser) ke akun ini
      description: Akun belum punya percakapan → percakapan tamu menjadi milik akun; sudah punya → pesan tamu dipindahkan dan percakapan tamu
        dihapus. Token tak dikenal → claimed=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/CustomerChatConversation'
                      claimed:
                        type: boolean
  /chat/guest:
    post:
      tags:
      - chat
      summary: Mulai percakapan sebagai tamu (formulir perkenalan + pesan pertama); maks. 10 per jam per IP
      description: Mengembalikan `token` acak 48 karakter yang disimpan browser tamu; token tidak pernah muncul lagi di respons lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - body
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 160
                phone:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: E.164 dengan kode negara, mis. +6281234567890 atau +60123456789 (8-15 digit; spasi/strip/titik/kurung boleh); tanpa
                    + hanya nomor Indonesia 0.../62...; rule PhoneNumber (A-78)
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      conversation:
                        $ref: '#/components/schemas/CustomerChatConversation'
                      message:
                        $ref: '#/components/schemas/ChatMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Terlalu banyak percakapan baru
    get:
      tags:
      - chat
      summary: Percakapan tamu (token wajib; salah → 404), parameter after/before seperti /customer/chat
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerChat'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/guest/messages:
    post:
      tags:
      - chat
      summary: Kirim pesan sebagai tamu; maks. 30 per menit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - body
              properties:
                token:
                  type: string
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/CustomerChatConversation'
                      message:
                        $ref: '#/components/schemas/ChatMessage'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /chat/guest/read:
    post:
      tags:
      - chat
      summary: Tamu menandai pesan admin sudah dibaca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/badges:
    get:
      tags:
      - admin-dashboard
      security:
      - cookieAuth: []
      summary: Penghitung badge sidebar admin; null = admin tidak punya modulnya
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      orders:
                        type: integer
                        nullable: true
                        description: 'order yang menunggu tindakan admin modul orders: awaiting_freight (permintaan penawaran ongkir CIF, ASUMSI
                          A-89) + paid, processing, shipped, delivered; payment_review dihitung di payments'
                      payments:
                        type: integer
                        nullable: true
                        description: pembayaran awaiting_verification (modul payments)
                      customers:
                        type: integer
                        nullable: true
                        description: customer berstatus pending (modul customers)
                      chat:
                        type: integer
                        nullable: true
                        description: percakapan dengan pesan customer belum dibaca (modul chat)
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/chats:
    get:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Kotak masuk percakapan (pesan terbaru dulu); meta.unreadConversations untuk badge
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
        description: nama
        email: null
        atau perusahaan customer: null
      - name: unread
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: perPage
        in: query
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminChatConversation'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PageMeta'
                    - type: object
                      properties:
                        unreadConversations:
                          type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Buka (atau buat) percakapan dengan customer tertentu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminChatConversation'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/chats/{conversation}:
    get:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Pesan dalam satu percakapan (after/before seperti sisi customer)
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      - name: after
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/AdminChatConversation'
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'
                      hasMore:
                        type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/chats/{conversation}/messages:
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Balas customer (tidak dicatat audit log; pesan itu sendiri catatannya)
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/AdminChatConversation'
                      message:
                        $ref: '#/components/schemas/ChatMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/chats/{conversation}/read:
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Tandai pesan customer pada percakapan ini sudah dibaca
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread:
                        type: integer
                      unreadConversations:
                        type: integer
  /admin/orders/{number}/attachments:
    post:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Unggah lampiran order (faktur pajak, surat jalan) ke disk private; hanya order yang sudah dibayar; customer mendapat notifikasi
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: dokumen PDF atau gambar jpg/png/webp ≤ 10 MB (ikn.commerce.attachment_*); berkas Office/zip → 415
                label:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          description: 'ATTACHMENT_NOT_ALLOWED: order belum dibayar (meta.status)'
        '413':
          description: Berkas terlalu besar
        '415':
          description: Jenis berkas tidak didukung
  /admin/orders/{number}/attachments/{attachment}:
    delete:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Hapus lampiran (berkasnya ikut dihapus)
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: attachment
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{number}/tracking:
    post:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Tambah catatan perjalanan kiriman (hanya status shipped); customer mendapat notifikasi
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  minLength: 3
                  maxLength: 200
                  example: Pesanan tiba di gudang transit Pekanbaru
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          description: 'TRACKING_NOT_ALLOWED: order tidak berstatus shipped (meta.status)'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/orders/{number}/tracking/{update}:
    delete:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Hapus catatan perjalanan (hanya selama status shipped)
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: update
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: TRACKING_NOT_ALLOWED
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sesi Sanctum SPA; sertakan juga header X-XSRF-TOKEN dari cookie XSRF-TOKEN.
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              remember:
                type: boolean
                default: false
                description: 'Ingat saya: cookie remember_web_* agar tetap login setelah peramban ditutup'
    Post:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              slug:
                type: string
                nullable: true
                description: otomatis dari judul bila kosong
              excerpt:
                $ref: '#/components/schemas/I18n'
              body:
                allOf:
                - $ref: '#/components/schemas/I18n'
                description: HTML per bahasa dari editor. Server men-sanitasi dengan whitelist (p, br, h2-h4, strong, em, u, s, a, ul, ol, li,
                  blockquote, img, figure, figcaption, hr, table, iframe YouTube/Vimeo saja; style hanya text-align). Tag/atribut lain dibuang.
              categoryId:
                type: integer
                nullable: true
                description: id dari /admin/news-categories
              author:
                type: string
                nullable: true
                maxLength: 120
              coverMediaId:
                type: integer
                nullable: true
              coverFrame:
                $ref: '#/components/schemas/MediaFrame'
              isPublished:
                type: boolean
              publishedAt:
                type: string
                format: date-time
                nullable: true
    PostCategory:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                $ref: '#/components/schemas/I18n'
              slug:
                type: string
                nullable: true
                maxLength: 80
                description: otomatis dari nama bila kosong; unik
              sortOrder:
                type: integer
                minimum: 0
    GalleryItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            - type
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              type:
                type: string
                enum:
                - image
                - video
              mediaId:
                type: integer
                nullable: true
                description: wajib untuk image
              frame:
                $ref: '#/components/schemas/MediaFrame'
              externalUrl:
                type: string
                nullable: true
                description: ID/URL YouTube
                wajib untuk video: null
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    Certificate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                $ref: '#/components/schemas/I18n'
              material:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              number:
                type: string
                nullable: true
                maxLength: 120
              issuer:
                type: string
                nullable: true
                maxLength: 160
              accreditation:
                type: string
                nullable: true
                maxLength: 120
              standard:
                type: string
                nullable: true
                maxLength: 120
              status:
                type: string
                enum:
                - active
                - expired
                - in_progress
                description: bawaan active
              mediaId:
                type: integer
                nullable: true
                description: berkas sertifikat; hanya media PDF (422 bila bukan PDF)
              logoMediaId:
                type: integer
                nullable: true
                description: logo/lencana sertifikat; hanya media gambar (422 bila bukan gambar)
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    Brochure:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              mediaId:
                type: integer
                nullable: true
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    CustomerLogo:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              mediaId:
                type: integer
                nullable: true
              url:
                type: string
                nullable: true
              isActive:
                type: boolean
              sortOrder:
                type: integer
    DocLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - category
            - label
            properties:
              category:
                type: string
                description: key item menu induk atau "wbs"
              label:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              mediaId:
                type: integer
                nullable: true
              url:
                type: string
                nullable: true
              isActive:
                type: boolean
              sortOrder:
                type: integer
  responses:
    UserSession:
      description: '{ data: { user } }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
    Deleted:
      description: '{ data: { deleted: true } }'
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: TOO_MANY_REQUESTS (header Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OkWithMessage:
      description: '{ data: { ok: true }, message }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok:
                    type: boolean
              message:
                type: string
    GeoResults:
      description: Hasil geocoding dinormalisasi
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/GeoResult'
    CustomerProfile:
      description: '{ data: CustomerProfile, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/CustomerProfile'
              message:
                type: string
    CustomerAddress:
      description: '{ data: CustomerAddress, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/CustomerAddress'
              message:
                type: string
    AdminCustomer:
      description: '{ data: AdminCustomer, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/AdminCustomer'
              message:
                type: string
    InvalidTransition:
      description: INVALID_TRANSITION (meta { from, to, paymentId? })
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentVerified:
      description: '{ data: { payment, order } }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
                  order:
                    $ref: '#/components/schemas/OrderRef'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        meta:
          type: object
    I18n:
      type: object
      properties:
        id:
          type: string
        en:
          type: string
          description: kosong → server mengisi dari id
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        lastPage:
          type: integer
    Media:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        disk:
          type: string
          enum:
          - public
          - private
          - external
        mime:
          type: string
          description: 'media URL: video/youtube, video/vimeo, video/x-gdrive, image/x-gdrive, image/x-url, video/x-url, atau mime dari ekstensi'
        size:
          type: integer
        originalName:
          type: string
        collection:
          type: string
        isImage:
          type: boolean
        meta:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          enum:
          - youtube
          - vimeo
          - gdrive
          - url
          description: hanya media dari URL (disk external)
        embedUrl:
          type: string
          nullable: true
          description: URL pemutar iframe (YouTube/Vimeo/Drive); null = putar langsung lewat <video>/<img>
        thumbnailUrl:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
          description: URL asli yang ditempel admin
    MediaSummary:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        url:
          type: string
        mime:
          type: string
        size:
          type: integer
        originalName:
          type: string
        provider:
          type: string
          enum:
          - youtube
          - vimeo
          - gdrive
          - url
          description: hanya media dari URL (disk external)
        embedUrl:
          type: string
          nullable: true
          description: URL pemutar iframe (YouTube/Vimeo/Drive); null = putar langsung lewat <video>/<img>
        thumbnailUrl:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
          description: URL asli yang ditempel admin
        frame:
          $ref: '#/components/schemas/MediaFrame'
    MediaFrame:
      type: object
      nullable: true
      description: 'Bingkai per pemakaian (A-93): titik fokus x/y (persen dari kiri/atas), zoom 1-3, rentang putar video start/end (detik). null
        = bawaan (tengah, tanpa zoom, tanpa rentang). Field media section menerima id atau {id, frame}; nilai di luar rentang dipotong ke batas
        untuk section, 422 untuk entitas lain.'
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
          example: 30
        y:
          type: number
          minimum: 0
          maximum: 100
          example: 40
        zoom:
          type: number
          minimum: 1
          maximum: 3
          example: 1.4
        start:
          type: number
          nullable: true
          minimum: 0
          example: 3
        end:
          type: number
          nullable: true
          minimum: 0
          example: 9
