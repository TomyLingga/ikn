            (meta { quoteId, status }: bukan putaran terakhir / sudah accepted, superseded, rejected) | FREIGHT_QUOTE_NOT_ALLOWED (order bukan
            awaiting_freight, atau penawaran bukan dari admin) | FREIGHT_PAYMENT_UNAVAILABLE (meta { currency, missing: paymentMethod|bankAccount
            }: tidak ada metode transfer manual aktif / rekening aktif se-mata-uang; penawaran tetap proposed)'
          content:
