    SalesByCurrency:
      type: object
      description: Total laporan per mata uang (Phase E6) dengan filter paid_at/status yang sama dengan summary. Uang dalam satuan terkecil mata
        uang baris (IDR rupiah, USD sen).
      properties:
        currency:
          type: string
          enum:
          - IDR
          - USD
        orders:
          type: integer
          description: order dibayar dalam rentang
        revenue:
          type: integer
          description: Σ grandTotal, satuan terkecil currency
        paidOrders:
          type: integer
          description: sama dengan orders (laporan hanya menghitung order dibayar; alias seperti summary.paidCount)
        averageOrder:
          type: integer
          description: revenue / orders dibulatkan ke bawah; 0 bila tidak ada order
    ExportKpis:
      type: object
      description: 'Blok ekspor dashboard (Phase E6): order USD saja, periode = period.from..period.to (awal bulan s.d. sekarang). Uang dalam
        sen.'
      properties:
        currency:
          type: string
          enum:
          - USD
        revenue:
          type: integer
          description: Σ grandTotal order USD dibayar (paid_at) dalam periode, sen
        paidOrders:
          type: integer
          description: jumlah order USD dibayar dalam periode
        orders:
          type: integer
          description: order USD dibuat (created_at) dalam periode, semua status
