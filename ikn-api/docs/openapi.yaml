          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/orders/{number}/freight-quotes:
    post:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: 'Penawaran ongkir CIF baru dengan rincian baris (ASUMSI A-89, kontrak 11.12): penawaran proposed sebelumnya → superseded, round
        = terakhir + 1'
      description: 'Hanya order `awaiting_freight`. `validUntil` kosong = sekarang + setting `freightQuoteValidDays`; tanggal saja (`YYYY-MM-DD`)
        = akhir hari itu;

        harus di masa depan. Customer diberi tahu (email `FreightQuoted` dengan tabel baris + masa berlaku, in-app `order.freight_quoted`). Dicatat
        audit.

        '
      parameters:
      - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreightQuoteInput'
      responses:
