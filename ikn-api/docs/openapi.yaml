          type: integer
        voucher:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            code:
              type: string
            type:
              type: string
              enum:
              - percent
              - fixed
            value:
              type: number
        deliveryTerm:
          allOf:
          - $ref: '#/components/schemas/DeliveryTerm'
          nullable: true
          description: cara serah terima yang dipakai quote (ASUMSI A-85)
        paymentTerm:
          allOf:
          - $ref: '#/components/schemas/PaymentTerm'
          nullable: true
          description: syarat pembayaran yang dikirim (ASUMSI A-87); null bila tidak dikirim
        shipping:
          $ref: '#/components/schemas/ShippingRateQuote'
          nullable: true
        availableShippingRates:
          type: array
          items:
            $ref: '#/components/schemas/ShippingRateQuote'
        shippingTotal:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                $ref: '#/components/schemas/I18n'
              type:
                type: string
              amount:
                type: integer
              currency:
                type: string
                enum:
                - IDR
                - USD
          description: hanya fee se-mata-uang dengan order
        feeTotal:
          type: integer
        taxRate:
          type: number
          example: 11
          description: taxRate (domestic) atau exportTaxRate bila term ber-taxProfile export (ASUMSI A-86)
        priceIncludesTax:
          type: boolean
        taxTotal:
          type: integer
          description: informasi bila inklusif; ditambahkan ke grandTotal bila eksklusif
        paymentMethodCode:
          type: string
          nullable: true
        uniqueCodeRequired:
          type: boolean
          description: manual_transfer + setting uniqueCodeEnabled; selalu false untuk USD
        uniqueCode:
          type: integer
          description: sementara 1–999 (0 bila tidak berlaku); final ditetapkan saat checkout
        grandTotal:
          type: integer
          description: subtotal − diskon + ongkir + fee + (pajak bila eksklusif) + uniqueCode
        weightGram:
          type: integer
        volumeCm3:
          type: integer
          description: Σ dimensi produk × qty (cm³); 0 bila dimensi produk kosong
        pickupPoints:
          type: array
          items:
            $ref: '#/components/schemas/PickupPoint'
          description: 'term Loco (ASUMSI A-90): satu titik ambil per pabrik asal item; [] untuk term lain'
        warningMeta:
          type: object
          description: rincian warning; {} bila tidak ada
          properties:
            factory_location_unset:
              type: object
              properties:
                factoryCodes:
                  type: array
                  items:
                    type: string
                  example:
                  - sei-bamban
        warnings:
          type: array
          items:
            type: string
            enum:
            - no_shipping_rate
            - shipping_rate_ignored_without_address
            - distance_unavailable
            - factory_location_unset
            - freight_quote_pending
          description: 'distance_unavailable = tarif per km disembunyikan karena alamat belum punya titik peta; factory_location_unset (ASUMSI
            A-90, menggantikan shipping_origin_unset) = pabrik asal item belum punya koordinat (kode di warningMeta); freight_quote_pending =
            term CIF (pricingMode quoted, ASUMSI A-89): ongkir ditawarkan admin setelah order dibuat, grandTotal sementara tanpa ongkir'
    PaymentMethodPublic:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: manual_transfer
        type:
          type: string
          enum:
          - manual_transfer
          - qris_static
          - qris_dynamic
          - virtual_account
          - ewallet
        driver:
          type: string
          enum:
          - manual
          - xendit
        name:
          $ref: '#/components/schemas/I18n'
        instructions:
          $ref: '#/components/schemas/I18n'
        qrisImageUrl:
          type: string
          nullable: true
          description: hanya qris_static
        sortOrder:
          type: integer
    CommerceConfig:
      type: object
      properties:
        market:
          type: string
          enum:
          - local
          - export
          description: pasar pengunjung (customer ekspor login = export; tamu/admin/lokal = local), ASUMSI A-86
        currency:
          type: string
          enum:
          - IDR
          - USD
          description: 'mata uang pengunjung: export = USD'
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodPublic'
          description: order USD hanya boleh memakai type manual_transfer (FE menyaring)
        bankAccounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              bankName:
                type: string
              accountNumber:
                type: string
              accountHolder:
                type: string
              currency:
                type: string
                enum:
                - IDR
                - USD
              swiftCode:
                type: string
                nullable: true
              bankAddress:
                type: string
                nullable: true
              correspondentBank:
                type: string
                nullable: true
              isActive:
                type: boolean
          description: semua rekening aktif; FE menyaring sesuai currency order
        fees:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
          description: fee untuk semua customer se-mata-uang dengan pengunjung
        paymentDueHours:
          type: integer
          description: order IDR
        exportPaymentDueHours:
          type: integer
          description: order USD (setting exportPaymentDueHours, ASUMSI A-86)
        taxRate:
          type: number
          description: term ber-taxProfile domestic
        exportTaxRate:
          type: number
          description: term ber-taxProfile export (FOB/CIF), bawaan 0
        priceIncludesTax:
          type: boolean
        uniqueCodeEnabled:
          type: boolean
          description: hanya order IDR
        autoCompleteDays:
          type: integer
        deliveryTerms:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryTerm'
          description: cara serah terima aktif pasar pengunjung, urut sortOrder (ASUMSI A-85, A-86)
        paymentTerms:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTerm'
          description: syarat pembayaran aktif pasar pengunjung (ASUMSI A-87); bawaan hanya untuk ekspor, jadi [] untuk tamu/lokal
        factories:
          type: array
          items:
            $ref: '#/components/schemas/FactoryLocation'
          description: semua lokasi pabrik urut sortOrder (ASUMSI A-90); titik ambil Loco = pabrik asal item yang allowsPickup
        pickup:
          allOf:
          - $ref: '#/components/schemas/PickupLocation'
          nullable: true
          description: pabrik bawaan (urutan pertama) dalam bentuk lama, label = nama dalam bahasa request; gunakan factories[] untuk data baru
        invoice:
          type: object
          description: teks cetakan invoice (penanda tangan, tembusan) untuk halaman cetak
          properties:
            signerName:
              type: string
            signerTitle:
              type: string
            cc:
              type: string
    BankAccount:
      type: object
      description: Rekening USD (ASUMSI A-86) membawa SWIFT, alamat bank, bank koresponden untuk instruksi bayar dan invoice ekspor
      properties:
        id:
          type: integer
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        currency:
          type: string
          enum:
          - IDR
          - USD
        swiftCode:
          type: string
          nullable: true
          example: BMRIIDJA
        bankAddress:
          type: string
          nullable: true
        correspondentBank:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BankAccountInput:
      type: object
      required:
      - bankName
      - accountNumber
      - accountHolder
      properties:
        bankName:
          type: string
          maxLength: 120
        accountNumber:
          type: string
          maxLength: 64
        accountHolder:
          type: string
          maxLength: 160
        currency:
          type: string
          enum:
          - IDR
          - USD
          default: IDR
          description: tidak dikirim saat PUT = tetap
        swiftCode:
          type: string
          nullable: true
          maxLength: 16
          pattern: ^[A-Z0-9]{8}([A-Z0-9]{3})?$
          description: dinormalkan uppercase tanpa spasi; tidak dikirim saat PUT = tetap, kosong = dihapus
        bankAddress:
          type: string
          nullable: true
          maxLength: 255
        correspondentBank:
          type: string
          nullable: true
          maxLength: 160
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
    Fee:
      type: object
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/I18n'
        type:
          type: string
          enum:
          - admin
          - other
        currency:
          type: string
          enum:
          - IDR
          - USD
          description: fee hanya dikenakan ke order se-mata-uang (ASUMSI A-86)
        amount:
          type: integer
          description: satuan terkecil currency (IDR rupiah, USD sen)
        isActive:
          type: boolean
        sortOrder:
          type: integer
        audience:
          type: string
          enum:
          - all
          - customers
          description: all = setiap order; customers = hanya order customer di `customers` (bentuk admin saja)
        customers:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOption'
          description: bentuk admin saja
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeeInput:
      type: object
      required:
      - name
      - amount
      properties:
        name:
          $ref: '#/components/schemas/I18n'
        type:
          type: string
          enum:
          - admin
          - other
          default: other
        currency:
          type: string
          enum:
          - IDR
          - USD
          default: IDR
          description: tidak dikirim saat PUT = tetap
        amount:
          type: integer
          minimum: 0
          description: satuan terkecil currency (USD dalam sen)
        isActive:
          type: boolean
          default: true
        sortOrder:
          type: integer
        audience:
          type: string
          enum:
          - all
          - customers
          default: all
          description: tidak dikirim saat PUT = sasaran tidak diubah
        customerIds:
          type: array
          items:
            type: integer
          description: wajib minimal satu bila audience=customers; id user ber-role customer
    CustomerOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
          nullable: true
        email:
          type: string
    ShippingZone:
      type: object
      properties:
        id:
          type: integer
        name:
          $ref: '#/components/schemas/I18n'
        isActive:
          type: boolean
        isDefault:
          type: boolean
          description: zona cadangan bila alamat tidak cocok zona mana pun
        priority:
          type: integer
          description: lebih besar menang saat level wilayah sama
        regions:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: '12.71'
              level:
                type: string
                enum:
                - province
                - regency
                - district
                - village
        rates:
          type: array
          items:
            $ref: '#/components/schemas/ShippingRate'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShippingZoneInput:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/I18n'
        isActive:
          type: boolean
          default: true
        isDefault:
          type: boolean
          default: false
        priority:
          type: integer
          default: 0
        regions:
          type: array
          items:
            type: object
            required:
            - code
            - level
            properties:
              code:
                type: string
                maxLength: 16
              level:
                type: string
                enum:
                - province
                - regency
                - district
                - village
    ShippingRate:
      type: object
      description: 'flat: amount = baseAmount. calculated (ASUMSI A-76): amount = max(minAmount, baseAmount + perKmAmount × ⌈km⌉ + perKgAmount
        × ⌈kg⌉ + perM3Amount × m³ (dibulatkan ke atas per 0,01 m³)); 0 bila subtotal − diskon ≥ freeAbove'
      properties:
        id:
          type: integer
        zoneId:
          type: integer
        zone:
          type: object
          properties:
            id:
              type: integer
            name:
              $ref: '#/components/schemas/I18n'
        name:
          $ref: '#/components/schemas/I18n'
        label:
          $ref: '#/components/schemas/I18n'
          description: sama dengan name (alias FE lama)
        type:
          type: string
          enum:
          - flat
          - calculated
        baseAmount:
          type: integer
        perKmAmount:
          type: integer
        perKgAmount:
          type: integer
        perM3Amount:
          type: integer
        minAmount:
          type: integer
        freeAbove:
          type: integer
          nullable: true
        eta:
          $ref: '#/components/schemas/I18n'
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShippingOrigin:
      type: object
      description: 'Rincian ongkir satu pabrik asal (ASUMSI A-90): ShippingRate::breakdown dengan berat/volume item pabrik itu dan jarak dari
        pabrik itu; base dan minAmount berlaku per pabrik, freeAbove terhadap subtotal seluruh order'
      properties:
        factory:
          allOf:
          - $ref: '#/components/schemas/FactoryBrief'
          nullable: true
        weightGram:
          type: integer
        volumeCm3:
          type: integer
        distanceKm:
          type: integer
          nullable: true
          description: null bila tarif tidak memakai jarak
        amount:
          type: integer
        breakdown:
          $ref: '#/components/schemas/ShippingBreakdown'
    ShippingRoadFactor:
      type: object
      required:
      - roadFactor
      properties:
        roadFactor:
          type: number
          minimum: 1
          maximum: 3
          example: 1.3
          description: dibulatkan 2 desimal
    FactoryBrief:
      type: object
      properties:
        code:
          type: string
          example: sei-bamban
        name:
          $ref: '#/components/schemas/I18n'
    FactoryLocation:
      type: object
      description: Lokasi pabrik, bentuk publik (GET /commerce/config factories[], ASUMSI A-90)
      properties:
        code:
          type: string
          example: tanjung-morawa
        name:
          $ref: '#/components/schemas/I18n'
        address:
          type: string
          example: Jl. Medan - Tanjung Morawa Km 9,5, Medan 20148, Sumatera Utara, Indonesia
        lat:
          type: number
          nullable: true
          example: 3.5387
        lng:
          type: number
          nullable: true
          example: 98.7467
        allowsPickup:
          type: boolean
          description: false = keranjang berisi item pabrik ini tidak bisa Loco (422 deliveryTermCode)
    AdminFactoryLocation:
      allOf:
      - $ref: '#/components/schemas/FactoryLocation'
      - type: object
        properties:
          id:
            type: integer
          sortOrder:
            type: integer
          isDefault:
            type: boolean
            description: urutan pertama = pabrik untuk produk tanpa factoryLocationId
          productsCount:
            type: integer
            description: produk (tidak terhapus) yang menunjuk pabrik ini
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    FactoryLocationInput:
      type: object
      required:
      - name
      - address
      properties:
        code:
          type: string
          maxLength: 32
          pattern: ^[a-z0-9][a-z0-9-]*$
          description: wajib saat POST (dinormalkan lowercase); PUT hanya boleh sama
        name:
          $ref: '#/components/schemas/I18n'
        address:
          type: string
          maxLength: 255
        lat:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
          description: wajib bersama lng; dibulatkan 6 desimal; null = tanpa pin (tarif per km tidak ditawarkan untuk item pabrik ini)
        lng:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
          description: wajib bersama lat
        allowsPickup:
          type: boolean
          default: true
        sortOrder:
          type: integer
          description: kosong saat POST = di akhir daftar
    PickupLocation:
      type: object
      description: Titik ambil bentuk lama { label, address, lat, lng } (GET /commerce/config pickup = pabrik bawaan, Order.pickup = titik pertama)
      properties:
        label:
          type: string
          example: Pabrik Tanjung Morawa
        address:
          type: string
          example: Jl. Medan - Tanjung Morawa Km 9,5, Medan 20148, Sumatera Utara, Indonesia
        lat:
          type: number
          nullable: true
          example: 3.5387
        lng:
          type: number
          nullable: true
          example: 98.7467
    PickupPoint:
      type: object
      description: Titik ambil Loco per pabrik asal (ASUMSI A-90); dibekukan di shippingAddress.points[] saat checkout
      properties:
        code:
          type: string
          nullable: true
          description: kode pabrik; null untuk order sebelum A-90
        name:
          allOf:
          - $ref: '#/components/schemas/I18n'
          nullable: true
        label:
          type: string
          nullable: true
          description: nama pabrik dalam bahasa customer saat checkout
        address:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        items:
          type: array
          items:
            type: string
          description: productSlug item yang diambil di titik ini
    DeliveryTerm:
