  /payments/webhook/{provider}:
    post:
      tags:
      - webhook
      summary: Webhook gateway (publik, tanpa CSRF, throttle api)
      description: 'Provider `xendit`: header `x-callback-token` harus sama dengan XENDIT_CALLBACK_TOKEN (salah → 401 WEBHOOK_SIGNATURE_INVALID,
        tetap dicatat).

        Payload disimpan mentah ke payment_webhook_logs. Idempoten by provider+external_id+event (`duplicate`).

        `external_id` = "{orderNumber}-{paymentId}". Nominal harus sama dengan payments.amount (selain itu `ignored`).

        Gateway hanya untuk order IDR; webhook yang merujuk payment USD → `ignored` (ASUMSI A-86).

        Status SUCCEEDED|PAID|COMPLETED → payment paid, order pending_payment → payment_review → paid (actor webhook);

        EXPIRED → payment expired (order tetap pending_payment sampai orders:expire); FAILED → payment failed.

        '
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - xendit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                id: qr_123
                external_id: IKN-20260921-00043-51
                status: SUCCEEDED
                amount: 16805217
                paid_at: '2026-09-21T03:00:00Z'
      responses:
        '200':
          description: Selalu 200 kecuali tanda tangan salah
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookResponse'
        '401':
          description: WEBHOOK_SIGNATURE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider tidak dikenal / tanpa webhook (manual)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
