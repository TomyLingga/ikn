            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminChatConversation'
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PageMeta'
                    - type: object
                      properties:
                        unreadConversations:
                          type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Buka (atau buat) percakapan dengan customer tertentu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminChatConversation'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/chats/{conversation}:
    get:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Pesan dalam satu percakapan (after/before seperti sisi customer)
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      - name: after
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/AdminChatConversation'
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'
                      hasMore:
                        type: boolean
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/chats/{conversation}/messages:
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Balas customer (tidak dicatat audit log; pesan itu sendiri catatannya)
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: '#/components/schemas/AdminChatConversation'
                      message:
                        $ref: '#/components/schemas/ChatMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/chats/{conversation}/read:
    post:
      tags:
      - admin-chat
      security:
      - cookieAuth: []
      summary: Tandai pesan customer pada percakapan ini sudah dibaca
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread:
                        type: integer
                      unreadConversations:
                        type: integer
  /admin/orders/{number}/attachments:
    post:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Unggah lampiran order (faktur pajak, surat jalan) ke disk private; hanya order yang sudah dibayar; customer mendapat notifikasi
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: dokumen PDF atau gambar jpg/png/webp ≤ 10 MB (ikn.commerce.attachment_*); berkas Office/zip → 415
                label:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          description: 'ATTACHMENT_NOT_ALLOWED: order belum dibayar (meta.status)'
        '413':
          description: Berkas terlalu besar
        '415':
          description: Jenis berkas tidak didukung
  /admin/orders/{number}/attachments/{attachment}:
    delete:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Hapus lampiran (berkasnya ikut dihapus)
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: attachment
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/orders/{number}/tracking:
    post:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Tambah catatan perjalanan kiriman (hanya status shipped); customer mendapat notifikasi
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  minLength: 3
                  maxLength: 200
                  example: Pesanan tiba di gudang transit Pekanbaru
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          description: 'TRACKING_NOT_ALLOWED: order tidak berstatus shipped (meta.status)'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/orders/{number}/tracking/{update}:
    delete:
      tags:
      - admin-orders
      security:
      - cookieAuth: []
      summary: Hapus catatan perjalanan (hanya selama status shipped)
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: update
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: TRACKING_NOT_ALLOWED
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Sesi Sanctum SPA; sertakan juga header X-XSRF-TOKEN dari cookie XSRF-TOKEN.
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
              remember:
                type: boolean
                default: false
                description: 'Ingat saya: cookie remember_web_* agar tetap login setelah peramban ditutup'
    Post:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              slug:
                type: string
                nullable: true
                description: otomatis dari judul bila kosong
              excerpt:
                $ref: '#/components/schemas/I18n'
              body:
                allOf:
                - $ref: '#/components/schemas/I18n'
                description: HTML per bahasa dari editor. Server men-sanitasi dengan whitelist (p, br, h2-h4, strong, em, u, s, a, ul, ol, li,
                  blockquote, img, figure, figcaption, hr, table, iframe YouTube/Vimeo saja; style hanya text-align). Tag/atribut lain dibuang.
              categoryId:
                type: integer
                nullable: true
                description: id dari /admin/news-categories
              author:
                type: string
                nullable: true
                maxLength: 120
              coverMediaId:
                type: integer
                nullable: true
              isPublished:
                type: boolean
              publishedAt:
                type: string
                format: date-time
                nullable: true
    PostCategory:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                $ref: '#/components/schemas/I18n'
              slug:
                type: string
                nullable: true
                maxLength: 80
                description: otomatis dari nama bila kosong; unik
              sortOrder:
                type: integer
                minimum: 0
    GalleryItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            - type
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              type:
                type: string
                enum:
                - image
                - video
              mediaId:
                type: integer
                nullable: true
                description: wajib untuk image
              externalUrl:
                type: string
                nullable: true
                description: ID/URL YouTube
                wajib untuk video: null
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    Certificate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                $ref: '#/components/schemas/I18n'
              material:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              mediaId:
                type: integer
                nullable: true
                description: berkas sertifikat; hanya media PDF (422 bila bukan PDF)
              logoMediaId:
                type: integer
                nullable: true
                description: logo/lencana sertifikat; hanya media gambar (422 bila bukan gambar)
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    Brochure:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - title
            properties:
              title:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              mediaId:
                type: integer
                nullable: true
              isPublished:
                type: boolean
              sortOrder:
                type: integer
    CustomerLogo:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              mediaId:
                type: integer
                nullable: true
              url:
                type: string
                nullable: true
              isActive:
                type: boolean
              sortOrder:
                type: integer
    DocLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - category
            - label
            properties:
              category:
                type: string
                description: key item menu induk atau "wbs"
              label:
                $ref: '#/components/schemas/I18n'
              description:
                $ref: '#/components/schemas/I18n'
              mediaId:
                type: integer
                nullable: true
              url:
                type: string
                nullable: true
              isActive:
                type: boolean
              sortOrder:
                type: integer
  responses:
    UserSession:
      description: '{ data: { user } }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
    Deleted:
      description: '{ data: { deleted: true } }'
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: TOO_MANY_REQUESTS (header Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OkWithMessage:
      description: '{ data: { ok: true }, message }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ok:
                    type: boolean
              message:
                type: string
    GeoResults:
      description: Hasil geocoding dinormalisasi
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/GeoResult'
    CustomerProfile:
      description: '{ data: CustomerProfile, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/CustomerProfile'
              message:
                type: string
    CustomerAddress:
      description: '{ data: CustomerAddress, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/CustomerAddress'
              message:
                type: string
    AdminCustomer:
      description: '{ data: AdminCustomer, message? }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/AdminCustomer'
              message:
                type: string
    InvalidTransition:
      description: INVALID_TRANSITION (meta { from, to, paymentId? })
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentVerified:
      description: '{ data: { payment, order } }'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
                  order:
                    $ref: '#/components/schemas/OrderRef'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        meta:
          type: object
    I18n:
      type: object
      properties:
        id:
          type: string
        en:
          type: string
          description: kosong → server mengisi dari id
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        lastPage:
          type: integer
    Media:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        disk:
          type: string
          enum:
          - public
          - private
        mime:
          type: string
        size:
          type: integer
        originalName:
          type: string
        collection:
          type: string
        isImage:
          type: boolean
        meta:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
    MediaSummary:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        url:
          type: string
        mime:
          type: string
        size:
          type: integer
        originalName:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
          - customer
        status:
          type: string
          enum:
          - pending
          - active
          - rejected
          - inactive
        emailVerifiedAt:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          nullable: true
        locale:
          type: string
          enum:
          - id
          - en
        permissions:
          type: array
          items:
            type: string
          description: admin saja; ["*"] untuk super_admin
        modules:
          type: array
          items:
            type: string
          description: admin saja
        approvedAt:
          type: string
          nullable: true
          description: customer saja
        rejectionReason:
          type: string
          nullable: true
          description: customer saja
        profile:
          $ref: '#/components/schemas/UserProfile'
          description: customer saja
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
        active:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        lastLoginAt:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
    AdminUserInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          description: wajib saat membuat
          min 8: null
        role:
          type: string
          enum:
          - super_admin
          - admin
        permissions:
          type: array
          items:
            type: string
        active:
          type: boolean
    SiteSettings:
      type: object
      properties:
        company:
          type: object
          properties:
            name:
              type: string
            short:
              type: string
            parent:
              type: string
            since:
              type: string
            location:
              type: string
            tagline:
              $ref: '#/components/schemas/I18n'
            profile_document:
              $ref: '#/components/schemas/MediaSummary'
        site:
          type: object
          properties:
            footer_headline:
              $ref: '#/components/schemas/I18n'
            footer_cta_label:
              $ref: '#/components/schemas/I18n'
            footer_connect_text:
              $ref: '#/components/schemas/I18n'
            footer_contact_text:
              $ref: '#/components/schemas/I18n'
            subsidiary_note:
              $ref: '#/components/schemas/I18n'
        seo:
          type: object
          properties:
            default_title:
              $ref: '#/components/schemas/I18n'
            default_description:
              $ref: '#/components/schemas/I18n'
        contact:
          type: object
          properties:
            whatsapp:
              type: string
              description: nomor utama, internasional tanpa +; kosong = tombol WhatsApp tidak tampil
            whatsapp_message:
              $ref: '#/components/schemas/I18n'
            whatsapp_contacts:
              type: array
              maxItems: 10
              description: nomor marketing tambahan; bersama nomor utama menjadi daftar pilihan di tombol melayang/footer/Kontak; nomor dinormalkan
                ke 62…, ganda ditolak
              items:
                type: object
                properties:
                  label:
                    type: string
                    maxLength: 60
                    example: Marketing Resiprene
                  number:
                    type: string
                    example: '628116480083'
        auth:
          type: object
          properties:
            slides:
              type: array
              maxItems: 6
              description: Panel foto/video halaman login/daftar/lupa password (A-79). PUT menerima [{mediaId, caption}] (media gambar atau video);
                respons [{media, caption}]. Kosong = foto bawaan FE.
              items:
                type: object
                properties:
                  media:
                    $ref: '#/components/schemas/MediaSummary'
                  mediaId:
                    type: integer
                    writeOnly: true
                  caption:
                    $ref: '#/components/schemas/I18n'
        analytics:
          type: object
          properties:
            ga_measurement_id:
              type: string
              description: G-XXXXXXXXXX; kosong = tanpa GA4
            gsc_verification:
              type: string
              description: token meta google-site-verification
        theme:
          type: object
          description: 'Warna tema situs, hex #rrggbb (disimpan lowercase; kosong = warna bawaan CSS). FE menyuntik nilai valid sebagai --theme-primary
            / --theme-primary-deep / --theme-accent di root layout; nilai lain → 422.'
          properties:
            primary:
              type: string
              example: '#0b6fb8'
              description: tombol, tautan, label, ikon aktif
            primary_deep:
              type: string
              example: '#0a3f6b'
              description: footer dan blok latar gelap
            accent:
              type: string
              example: '#1785cc'
              description: nomor bagian, badge promo, sorotan kecil
        admin:
          type: object
          description: privat (hanya GET/PUT admin)
    Page:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          $ref: '#/components/schemas/I18n'
        status:
          type: string
          enum:
          - draft
          - published
        template:
          type: string
        seo:
          type: object
          properties:
            title:
              $ref: '#/components/schemas/I18n'
            description:
              $ref: '#/components/schemas/I18n'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
        updatedAt:
          type: string
          nullable: true
        isProtected:
          type: boolean
          description: admin saja
    PageInput:
      type: object
      properties:
        slug:
          type: string
        title:
          $ref: '#/components/schemas/I18n'
        status:
          type: string
          enum:
          - draft
          - published
        template:
          type: string
        seo:
          type: object
          properties:
            title:
              $ref: '#/components/schemas/I18n'
            description:
              $ref: '#/components/schemas/I18n'
    Section:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          nullable: true
        type:
          type: string
          description: lihat GET /admin/cms/section-types
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        content:
          type: object
          description: sesuai skema tipe; field media terhidrasi menjadi MediaSummary
        updatedAt:
          type: string
          nullable: true
    Menu:
      type: object
      properties:
        location:
          type: string
          enum:
          - header
          - footer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        updatedAt:
          type: string
          nullable: true
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          nullable: true
        label:
          $ref: '#/components/schemas/I18n'
        description:
          $ref: '#/components/schemas/I18n'
        url:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    MenuItemInput:
      type: object
      required:
      - label
      properties:
        key:
          type: string
          nullable: true
        label:
          $ref: '#/components/schemas/I18n'
        description:
          $ref: '#/components/schemas/I18n'
        url:
          type: string
          nullable: true
        isActive:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemInput'
    ContactInfo:
      type: object
      properties:
        locations:
          type: array
          items:
            type: object
            properties:
              name:
                $ref: '#/components/schemas/I18n'
              address:
                type: string
              phones:
                type: array
                items:
                  type: object
                  properties:
                    number:
                      type: string
        emails:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
        social:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              handle:
                type: string
              url:
                type: string
    DocLink:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        label:
          $ref: '#/components/schemas/I18n'
        description:
          $ref: '#/components/schemas/I18n'
        file:
          $ref: '#/components/schemas/MediaSummary'
        url:
          type: string
          nullable: true
        targetUrl:
