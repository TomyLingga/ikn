              schema:
                $ref: '#/components/schemas/Error'
  /customer/orders/{number}/payments:
    get:
      tags:
      - payments
      security:
      - cookieAuth: []
      summary: Histori percobaan bayar order
      parameters:
      - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - payments
      security:
      - cookieAuth: []
      summary: Ganti metode bayar (payment baru)
      description: 'Payment manual `pending` (belum ada bukti) dibatalkan dan diganti. `awaiting_verification` (order payment_review)

        atau payment gateway yang masih pending → 409 PAYMENT_ALREADY_ACTIVE. Kode unik dihitung ulang bila pindah

        ke/dari manual_transfer; `grandTotal` order diperbarui. Lewat batas waktu → 409 ORDER_EXPIRED.

        '
      parameters:
      - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentMethodCode
              properties:
                paymentMethodCode:
                  type: string
                bankAccountId:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/Payment'
                      order:
                        $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PAYMENT_ALREADY_ACTIVE (meta.paymentId) | ORDER_EXPIRED | INVALID_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /customer/orders/{number}/proof:
    post:
      tags:
      - payments
      security:
      - cookieAuth: []
      summary: Unggah bukti bayar (multipart) → payment awaiting_verification, order payment_review
      description: '`file` jpg/png/pdf ≤ 5 MB (disk private, diunduh lewat GET /files/{mediaId} oleh pemilik order dan admin).

        `paymentId` opsional (default payment aktif). Bila payment aktif rejected/tidak ada → payment baru dengan metode & rekening yang sama.

        Setelah `paymentDueAt` → 409 ORDER_EXPIRED. Masih menunggu verifikasi → 409 PAYMENT_ALREADY_ACTIVE. Metode gateway → 422 paymentId.

        '
      parameters:
      - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                paymentId:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProofResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: ORDER_EXPIRED | PAYMENT_ALREADY_ACTIVE | INVALID_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments/webhook/{provider}:
    post:
      tags:
      - webhook
      summary: Webhook gateway (publik, tanpa CSRF, throttle api)
      description: 'Provider `xendit`: header `x-callback-token` harus sama dengan XENDIT_CALLBACK_TOKEN (salah → 401 WEBHOOK_SIGNATURE_INVALID,
        tetap dicatat).

        Payload disimpan mentah ke payment_webhook_logs. Idempoten by provider+external_id+event (`duplicate`).

        `external_id` = "{orderNumber}-{paymentId}". Nominal harus sama dengan payments.amount (selain itu `ignored`).

        Status SUCCEEDED|PAID|COMPLETED → payment paid, order pending_payment → payment_review → paid (actor webhook);

        EXPIRED → payment expired (order tetap pending_payment sampai orders:expire); FAILED → payment failed.

        '
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
