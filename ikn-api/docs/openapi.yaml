          type: object
          properties:
            ga_measurement_id:
              type: string
              description: G-XXXXXXXXXX; kosong = tanpa GA4
            gsc_verification:
              type: string
              description: token meta google-site-verification
        theme:
          type: object
          description: 'Tema Navy · Cream · Coral (A-91), satu set per mode, hex #rrggbb (disimpan lowercase; kosong = warna bawaan CSS). FE menyuntik
            nilai valid sebagai --tl-* (terang) / --td-* (gelap) di root layout; nilai lain → 422.'
          properties:
            light_base:
              type: string
              example: '#f4ede0'
              description: 'terang: latar dominan (cream)'
            light_ink:
              type: string
              example: '#102d50'
              description: 'terang: teks, pita, tombol (navy); juga header email'
            light_accent:
              type: string
              example: '#ff6b5b'
              description: 'terang: sorotan kecil, ikon (coral)'
            light_soft:
              type: string
              example: '#dceaf7'
              description: 'terang: latar section berfoto (biru muda)'
            dark_base:
              type: string
              example: '#102d50'
              description: 'gelap: latar dominan (navy)'
            dark_ink:
              type: string
              example: '#f4ede0'
              description: 'gelap: teks dan tombol (cream)'
            dark_accent:
              type: string
              example: '#ff6b5b'
              description: 'gelap: sorotan kecil, ikon (coral)'
            dark_deep:
              type: string
              example: '#0b1220'
              description: 'gelap: latar terdalam (panel admin, pita)'
        invoice:
          type: object
          description: Kop & kaki cetakan invoice dari gambar (A-83), publik. PUT menerima id media gambar (PNG/JPG; PDF → 422) atau null/"" =
            kosong (FE merender kop/kaki dari teks). Bawaan seeder = pindaian kop surat klien. Media yang dipakai tidak bisa dihapus.
          properties:
            header_image:
              $ref: '#/components/schemas/MediaSummary'
            footer_image:
              $ref: '#/components/schemas/MediaSummary'
        admin:
          type: object
          description: privat (hanya GET/PUT admin)
        mail:
          type: object
          description: Email notifikasi (A-82), privat. Diterapkan ke config mail saat runtime tanpa restart (HTTP dan worker antrean). mode smtp
            mewajibkan host + from_address; semua nilai dibersihkan dulu, satu saja tidak valid → tidak ada yang disimpan.
          properties:
            mode:
              type: string
              enum:
              - server
              - smtp
              - false
              description: server = ikut MAIL_* .env; smtp = SMTP di bawah (webmail klien); off = tidak kirim email (notifikasi in-app tetap jalan)
            host:
              type: string
              example: smtp.hostinger.com
            port:
              type: integer
              minimum: 1
              maximum: 65535
              example: 465
            encryption:
              type: string
              enum:
              - ssl
              - tls
              - ''
              description: ssl (465), tls/STARTTLS (587), kosong = tanpa enkripsi
            username:
              type: string
              example: noreply@ptikn.com
            password:
              type: string
              description: Disimpan terenkripsi (APP_KEY). Respons selalu "********" bila terisi; PUT dengan "********" = tidak mengubah, "" =
                hapus.
            from_address:
              type: string
              format: email
              description: lowercase; wajib pada mode smtp
            from_name:
              type: string
              maxLength: 120
    MailTestResult:
      type: object
