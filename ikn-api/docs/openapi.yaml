  /cart/quote:
    post:
      tags:
      - cart
      security:
      - cookieAuth: []
      summary: Validasi item dan hitung total tanpa membuat order (customer login; belum harus disetujui)
      description: 'Body sama dengan POST /customer/orders. `deliveryTermCode` memilih cara serah terima (ASUMSI A-85); kosong =

        term aktif pertama pasar lokal (sortOrder). Term `pricingMode = zone` (Franco): tanpa `addressId` → `shipping = null`,

        `availableShippingRates = []`; dengan `addressId` (alamat milik user) `availableShippingRates[]` dihitung untuk berat

        keranjang dan `shipping` terisi bila `shippingRateId` termasuk daftar itu. Dua pabrik atau lebih (ASUMSI A-90): item

        dikelompokkan per pabrik asal (`items[].factory`); tiap tarif dihitung per pabrik (base, minAmount, berat, volume, jarak

        dari pabrik itu) lalu dijumlah, rinciannya di `origins[]`; `freeAbove` dibandingkan dengan subtotal − diskon seluruh order.

        Term Loco: `pickupPoints[]` = satu titik ambil per pabrik asal; bila ada item dari pabrik `allowsPickup = false` → 422

        `deliveryTermCode`. Term tanpa ongkir (Loco `none`, FOB `included`):

        `shipping` = baris sintetis `{ type: pickup|included, amount: 0, rateId: null }`, `availableShippingRates = []`, alamat

        dan `shippingRateId` diabaikan tanpa warning. Term CIF (`quoted`, ASUMSI A-89): `shipping.type = quoted`, `amount` 0, dan

        `warnings` berisi `freight_quote_pending` (ongkir ditawarkan admin setelah order dibuat). `uniqueCode` bersifat sementara (1–999) bila
        metode `manual_transfer`

        dan setting `uniqueCodeEnabled`; nilai final ditetapkan saat checkout.

        Mata uang (ASUMSI A-86) mengikuti pasar customer: customer ekspor mendapat `currency = USD`, harga dari `price_usd` (sen),

        pajak dari `exportTaxRate` bila term ber-`taxProfile` export, fee hanya yang USD, tanpa kode unik dan voucher

        (409 VOUCHER_INVALID reason `currency`), metode bayar hanya `manual_transfer`. `paymentTermCode` (ASUMSI A-87) opsional di quote;

        bila dikirim harus aktif dan sesuai pasar.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QuoteResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: INSUFFICIENT_STOCK (meta.items[] { productSlug, requested, available }) atau VOUCHER_INVALID (meta.reason in not_found|inactive|expired|not_started|quota|per_user_limit|min_subtotal|scope|not_eligible|currency)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'VALIDATION_ERROR: produk tidak ada/unpublished/price_mode=quote/tanpa harga dalam mata uang customer (items.N.productSlug),
            qty < moq (items.N.qty), shippingRateId tidak berlaku, paymentMethodCode tidak aktif atau bukan manual_transfer untuk order USD, addressId
            bukan milik user, deliveryTermCode tidak ada/nonaktif/beda pasar atau tidak ada term aktif sama sekali, paymentTermCode tidak ada/nonaktif/beda
            pasar'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
