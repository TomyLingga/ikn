# Dev compose untuk ikn-api (Docker belum terpasang di mesin dev saat ini, ASUMSI A-27; file ini target Phase 12).
# Jalankan dari ikn-api/: docker compose up -d ; docker compose exec app php artisan migrate --seed
name: ikn

services:
  app:
    build:
      context: .
      target: dev
      args: { UID: 1000, GID: 1000 }
    env_file: .env.docker
    environment:
      APP_ENV: local
      RUN_MIGRATIONS: "false"
      PHP_PM_MAX_CHILDREN: "8"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    build: { context: ., target: dev }
    env_file: .env.docker
    environment: { APP_ENV: local, PHP_PM_MAX_CHILDREN: "2", PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1" }
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--sleep=3"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db: { condition: service_healthy }

  scheduler:
    build: { context: ., target: dev }
    env_file: .env.docker
    environment: { APP_ENV: local, PHP_PM_MAX_CHILDREN: "2", PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1" }
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on: [app]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikn
      POSTGRES_USER: ikn
      POSTGRES_PASSWORD: ikn
      TZ: Asia/Jakarta
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikn -d ikn"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # fe:
  #   build:
  #     context: ../ikn-fe
  #     args: { NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1 }
  #   environment: { API_INTERNAL_URL: http://nginx/api/v1 }
  #   ports: ["3000:3000"]

volumes:
  vendor:
  pgdata:
